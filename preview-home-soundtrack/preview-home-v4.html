<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6f7">
  <title>曲線時報 / The Curve Times</title>
  <meta name="description" content="Sy 的个人博客。文章、随笔与音乐。">
  <script>
    (() => {
      let pref = 'auto';
      try { pref = localStorage.getItem('curve-theme') || 'auto'; } catch (_) {}
      const dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      const h = new Date().getHours();
      document.documentElement.dataset.time = h >= 5 && h < 8 ? 'dawn' : h >= 17 && h < 20 ? 'dusk' : h >= 22 || h < 5 ? 'deep-night' : 'day';
    })();
  </script>
  <style>
    :root {
      --paper:#f3f6f7; --ink:#0e181e; --sub:#43545b; --muted:#64747b;
      --line:#c4cfd4; --red:#ce1c2e; --wash:#e4ebee;
      --sound:#111c23; --sound-ink:#f5f8f8; --sound-sub:#b4c1c8; --sound-line:#475b67;
      --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
      --mono:"SFMono-Regular",Menlo,Consolas,monospace;
    }
    :root[data-mode="light"][data-time="dawn"] { --paper:#f1f5f5; --wash:#e2ecec; }
    :root[data-mode="light"][data-time="dusk"] { --paper:#eff3f6; --wash:#e1e9ef; }
    :root[data-mode="light"][data-time="deep-night"] { --paper:#eaf0f4; --wash:#dce7ee; }
    :root[data-mode="dark"] {
      --paper:#10171c; --ink:#edf2f4; --sub:#becbd2; --muted:#9baeb8;
      --line:#3c4d58; --red:#ff4b5d; --wash:#1c2a33;
      --sound:#050d13; --sound-line:#415463;
    }
    :root[data-mode="dark"][data-time="dawn"] { --paper:#141d21; --wash:#233137; }
    :root[data-mode="dark"][data-time="dusk"] { --paper:#151b24; --wash:#242c3b; }
    :root[data-mode="dark"][data-time="deep-night"] { --paper:#0b131c; --wash:#172636; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html { scroll-behavior:smooth; scroll-padding-top:124px; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; }
    button,a,input,select { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    button { color:inherit; }
    a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--red); outline-offset:5px; }
    ::selection { background:var(--red); color:#fff; }
    .shell { width:min(1320px,calc(100% - 96px)); margin-inline:auto; }
    .skip { position:fixed; top:-80px; left:16px; z-index:100; background:var(--ink); color:var(--paper); padding:12px; }
    .skip:focus { top:12px; }
    .utility { display:flex; align-items:center; justify-content:space-between; min-height:49px; gap:20px; border-bottom:1px solid var(--line); }
    .utility .byline { font-family:var(--mono); font-size:12px; }
    .utility-right,.topnav { display:flex; align-items:center; gap:25px; }
    .topnav a { padding:15px 0 13px; font-size:12px; border-bottom:2px solid transparent; }
    .topnav a:hover,.topnav a[aria-current="page"] { border-bottom-color:var(--red); }
    .theme { background:transparent; color:var(--sub); border:0; border-left:1px solid var(--line); border-radius:0; padding:4px 0 4px 13px; font-size:12px; }
    .theme option { color:var(--ink); background:var(--paper); }
    .masthead { display:flex; align-items:end; justify-content:space-between; gap:32px; padding:27px 0 26px; }
    .wordmark { margin:0; font-size:clamp(55px,7.2vw,104px); font-weight:900; line-height:1.02; letter-spacing:-.085em; }
    .identity { display:flex; align-items:end; gap:22px; }
    .latin { margin:0 0 5px; font-family:var(--mono); font-size:11px; line-height:1.6; letter-spacing:.1em; }
    .collection-note { margin:0 0 5px; color:var(--sub); font-size:12px; line-height:1.85; text-align:right; }
    .collection-note strong { font-weight:650; color:var(--ink); }

    /* One continuous sound surface. It stays with the reader, without a second player. */
    .soundbar { position:sticky; top:0; z-index:30; background:var(--sound); color:var(--sound-ink); }
    .sound-inner { display:grid; grid-template-columns:60px minmax(150px,1fr) auto minmax(140px,.8fr) auto; align-items:center; gap:22px; padding-block:16px; min-height:92px; }
    .cover { width:60px; height:60px; overflow:hidden; background:#253b48; }
    .cover img { display:block; width:100%; height:100%; object-fit:cover; }
    .track-copy { min-width:0; }
    .track-name { display:block; font-size:16px; font-weight:750; line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .track-artist { display:block; color:var(--sound-sub); margin-top:3px; font-size:11px; }
    .controls { display:flex; gap:7px; align-items:center; }
    .controls button { display:grid; place-items:center; width:38px; height:38px; background:transparent; color:var(--sound-ink); padding:0; border:1px solid transparent; }
    .controls button:hover { border-color:var(--sound-line); }
    .controls .play { width:46px; height:46px; background:var(--red); color:#fff; border:0; }
    .controls .play:hover { outline:1px solid #fff; outline-offset:3px; }
    .controls .play:active { transform:scale(.96); }
    .controls svg { width:18px; height:18px; fill:currentColor; }
    .controls .play svg { width:21px; height:21px; }
    .progress { min-width:0; }
    .seek { display:block; width:100%; height:22px; appearance:none; background:transparent; padding:0; margin:0; cursor:pointer; }
    .seek::-webkit-slider-runnable-track { height:2px; background:linear-gradient(to right,var(--red) var(--seek,0%),var(--sound-line) var(--seek,0%)); }
    .seek::-webkit-slider-thumb { appearance:none; width:10px; height:10px; margin-top:-4px; border:0; border-radius:50%; background:var(--sound-ink); }
    .seek::-moz-range-track { height:2px; background:var(--sound-line); }
    .seek::-moz-range-progress { height:2px; background:var(--red); }
    .seek::-moz-range-thumb { width:10px; height:10px; border:0; border-radius:50%; background:var(--sound-ink); }
    .times { display:flex; justify-content:space-between; font-family:var(--mono); font-size:9px; color:var(--sound-sub); }
    .library-toggle { min-width:77px; height:38px; background:transparent; border:1px solid var(--sound-line); color:var(--sound-ink); font-size:12px; }
    .library-toggle:hover,.library-toggle[aria-expanded="true"] { background:#263b47; border-color:#8ba0ac; }
    .library { position:absolute; top:100%; right:max(48px,calc((100% - 1320px)/2)); width:480px; max-width:calc(100% - 32px); max-height:var(--library-room,70vh); display:flex; flex-direction:column; background:var(--sound); border:1px solid var(--sound-line); border-top:0; padding:21px 24px 17px; }
    .library-heading { flex:none; display:flex; justify-content:space-between; align-items:baseline; border-bottom:1px solid var(--sound-line); padding-bottom:12px; }
    .library .progress { flex:none; }
    .library-heading h2 { margin:0; font-size:17px; }
    .library-heading span { font-family:var(--mono); font-size:10px; color:var(--sound-sub); }
    .queue { list-style:none; margin:0; padding:0; flex:1; min-height:0; max-height:470px; overflow:auto; overscroll-behavior:contain; }
    .queue li+li { border-top:1px solid #2e414d; }
    .queue button { width:100%; padding:13px 0; display:grid; grid-template-columns:16px minmax(0,1fr) auto; align-items:baseline; gap:13px; background:transparent; border:0; color:var(--sound-ink); text-align:left; }
    .queue button:hover { background:#1b2b36; }
    .queue button[aria-current="true"] .queue-name { color:#ff5263; }
    .queue-cue { width:6px; height:6px; align-self:center; background:transparent; }
    .queue button[aria-current="true"] .queue-cue { background:var(--red); }
    .queue-name { font-size:13px; font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .queue-artist { font-size:10px; color:var(--sound-sub); text-align:right; }
    .player-status { flex:none; margin:11px 0 0; min-height:16px; font-size:10px; color:var(--sound-sub); }

    .latest { display:grid; grid-template-columns:132px minmax(0,1fr); gap:28px; padding:44px 0 38px; border-bottom:2px solid var(--ink); }
    .post-date { font-family:var(--mono); color:var(--muted); font-size:12px; line-height:1.7; }
    .latest-label { display:block; margin-bottom:13px; color:var(--red); font-family:var(--sans); font-weight:750; font-size:12px; }
    .date-month { display:block; color:var(--ink); font-size:22px; letter-spacing:-.06em; line-height:1.4; }
    .date-year { display:block; font-size:11px; }
    .latest-body { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(260px,.8fr); gap:35px; align-items:end; }
    .lead-title { margin:0; font-size:clamp(43px,4.6vw,67px); font-weight:850; letter-spacing:-.055em; line-height:1.18; }
    .lead-title a { display:block; }
    .title-line { display:block; white-space:nowrap; overflow:hidden; padding-bottom:.05em; }
    .title-part { display:inline-block; }
    .title-negation { color:var(--red); }
    .lead-title.long-title { font-size:clamp(29px,3vw,43px); line-height:1.45; letter-spacing:-.025em; overflow-wrap:break-word; }
    .lead-title a:hover { text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:8px; }
    .lead-context { padding-bottom:4px; }
    .lead-description { margin:0; max-width:34em; color:var(--sub); font-size:15px; line-height:1.85; }
    .post-meta { font-size:11px; color:var(--muted); margin:16px 0 0; }
    .lead-bottom { display:flex; align-items:center; gap:23px; margin-top:20px; }
    .read { display:inline-block; font-size:12px; font-weight:700; padding-bottom:5px; border-bottom:2px solid var(--red); }
    .read:hover { border-color:var(--ink); }
    .perform .title-negation { animation:word-land 410ms 200ms both; }
    .perform .title-object { animation:word-land 480ms 860ms both; }
    @keyframes word-land {
      0% { transform:translateY(-112%); animation-timing-function:cubic-bezier(.5,.02,.83,.49); }
      85% { transform:translateY(0); animation-timing-function:cubic-bezier(.16,.8,.24,1); }
      100% { transform:translateY(0); }
    }

    .directory-head { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:31px 0 19px; }
    .directory-head h2 { margin:0; font-size:20px; font-weight:750; letter-spacing:-.025em; }
    .search { width:230px; max-width:50%; padding:8px 0; font-size:12px; color:var(--ink); border:0; border-bottom:1px solid var(--line); border-radius:0; background:transparent; }
    .search::placeholder { color:var(--muted); }
    .year-section { border-top:1px solid var(--ink); }
    .year-label { display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin:0; padding:16px 0 13px; font-family:var(--mono); font-size:19px; font-weight:500; }
    .year-label span { font-family:var(--sans); font-size:10px; color:var(--muted); }
    .entry { position:relative; border-top:1px solid var(--line); }
    .entry-link { display:grid; grid-template-columns:132px minmax(0,1fr) minmax(260px,.75fr); gap:28px; align-items:baseline; padding:25px 0 26px; }
    .entry-title { margin:0; font-size:24px; font-weight:720; line-height:1.5; letter-spacing:-.02em; overflow-wrap:break-word; }
    .entry-description { margin:0; color:var(--sub); font-size:13px; line-height:1.85; }
    .entry-link::before { content:""; position:absolute; inset:0; background:var(--wash); opacity:0; z-index:-1; transition:opacity 160ms cubic-bezier(.2,.7,.2,1); }
    .entry-link:hover::before { opacity:1; }
    .entry-link:hover .entry-title { text-decoration:underline; text-decoration-color:var(--red); text-decoration-thickness:1px; text-underline-offset:5px; }
    .entry-time { font-family:var(--mono); font-size:12px; color:var(--muted); }
    .photo-entry .entry-link { align-items:start; grid-template-columns:132px minmax(0,1fr) minmax(280px,.85fr); padding-block:30px; }
    .photo-entry .entry-copy { display:flex; flex-direction:column; align-items:start; }
    .photo-entry .entry-description { margin-top:12px; max-width:25em; }
    .post-photo { margin:0; }
    .post-photo img { width:100%; aspect-ratio:1.48; object-fit:cover; display:block; }
    .post-photo figcaption { font-size:10px; color:var(--muted); margin-top:8px; }
    .year-section+.year-section { margin-top:30px; }
    .empty { font-size:14px; padding:30px 0; color:var(--sub); }
    .endnav { display:flex; gap:26px; padding:33px 0 55px; border-top:1px solid var(--line); }
    .endnav a { font-size:12px; padding-bottom:5px; border-bottom:1px solid var(--line); }
    .endnav a:hover { border-color:var(--ink); }
    .sitefoot { padding:21px 0 27px; background:var(--ink); color:var(--paper); }
    .foot-inner { display:flex; align-items:baseline; justify-content:space-between; gap:20px; font-size:11px; }
    .foot-inner strong { font-size:15px; letter-spacing:-.04em; }
    .foot-links { display:flex; gap:20px; }
    .foot-links a { text-decoration:underline; text-underline-offset:4px; }

    /* The same controller keeps playing while a real article is opened in the preview. */
    .reader { padding:25px 0 60px; }
    .back { border:0; border-bottom:1px solid var(--line); padding:7px 0; background:transparent; font-size:12px; }
    .reader-page { max-width:780px; margin:35px auto 0; }
    .reader-title { font-size:clamp(28px,4vw,46px); line-height:1.45; letter-spacing:-.035em; margin:15px 0 24px; }
    .article-body { font-size:17px; line-height:1.95; overflow-wrap:break-word; }
    .article-body p { margin:1.4em 0; }
    .article-body h2,.article-body h3 { margin:1.8em 0 .7em; line-height:1.5; }
    .article-body a { text-decoration:underline; text-underline-offset:4px; }
    .article-body img { max-width:100%; height:auto; }
    .article-body pre { background:var(--wash); padding:20px; overflow:auto; font-size:13px; line-height:1.7; }
    .article-body code { font-family:var(--mono); font-size:.88em; }
    .article-body blockquote { margin:1.6em 0; border-left:2px solid var(--red) !important; padding:1px 20px; color:var(--sub); }
    .article-body hr { margin:2.4em 0; border:0; border-top:1px solid var(--line); }

    @media (max-width:1120px) {
      .shell { width:calc(100% - 56px); }
      .sound-inner { gap:16px; grid-template-columns:56px minmax(140px,1fr) auto minmax(130px,.7fr) auto; }
      .cover { width:56px; height:56px; }
      .latest { grid-template-columns:94px minmax(0,1fr); gap:22px; }
      .latest-body { grid-template-columns:minmax(0,1.25fr) minmax(230px,.8fr); gap:24px; }
      .lead-title { font-size:clamp(38px,4.65vw,53px); }
      .entry-link,.photo-entry .entry-link { grid-template-columns:94px minmax(0,1fr) minmax(230px,.8fr); gap:22px; }
      .entry-title { font-size:21px; }
      .library { right:28px; }
    }
    @media (max-width:820px) {
      .latin { display:none; }
      .masthead { padding-block:23px; }
      .sound-inner { grid-template-columns:48px minmax(100px,1fr) auto auto; gap:12px; padding-block:13px; min-height:77px; }
      .cover { width:48px; height:48px; }
      .progress { grid-column:2; }
      .sound-inner .progress { display:none; }
      .controls .mute { display:none; }
      .controls button { width:30px; height:38px; }
      .controls .play { width:40px; height:40px; }
      .latest-body { grid-template-columns:1fr; gap:22px; }
      .lead-title { font-size:clamp(38px,6.5vw,54px); }
      .lead-context { max-width:37em; }
      .latest { padding-block:33px; }
      .entry-link { grid-template-columns:70px minmax(0,1fr); gap:6px 19px; padding-block:22px; }
      .entry-description { grid-column:2; }
      .photo-entry .entry-link { grid-template-columns:70px minmax(0,1fr); gap:12px 19px; }
      .post-photo { grid-column:2; width:min(100%,440px); }
      .photo-entry .entry-description { max-width:37em; margin-top:7px; }
    }
    @media (max-width:540px) {
      html { scroll-padding-top:105px; }
      .shell { width:calc(100% - 36px); }
      .utility { min-height:42px; }
      .utility .byline { font-size:10px; }
      .utility-right { gap:14px; }
      .topnav { gap:14px; }
      .topnav a { font-size:11px; padding-block:13px 10px; }
      .topnav a:nth-child(n+3) { display:none; }
      .theme { font-size:10px; padding-left:10px; }
      .masthead { align-items:center; padding:21px 0; gap:12px; }
      .wordmark { font-size:clamp(43px,12vw,61px); letter-spacing:-.085em; }
      .collection-note { font-size:10px; margin:0; line-height:1.65; max-width:108px; }
      .sound-inner { grid-template-columns:42px minmax(0,1fr) auto auto; gap:10px; min-height:76px; padding-block:12px; }
      .cover { width:42px; height:42px; }
      .track-name { font-size:12px; }
      .track-artist { font-size:10px; margin-top:2px; }
      .controls { gap:0; }
      .controls button { width:26px; }
      .controls .previous { display:none; }
      .controls .play { width:37px; height:37px; }
      .controls svg { width:14px; height:14px; }
      .controls .play svg { width:18px; height:18px; }
      .library-toggle { min-width:47px; width:47px; height:34px; font-size:10px; }
      .library-toggle .queue-total { display:none; }
      .library { width:calc(100% - 36px); right:18px; padding:17px 17px 13px; }
      .queue-artist { max-width:97px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .latest { display:block; padding:28px 0 30px; }
      .post-date { display:flex; align-items:baseline; gap:10px; font-size:10px; margin-bottom:17px; }
      .latest-label { display:inline; font-size:11px; margin:0 6px 0 0; }
      .date-month { display:inline; font-size:12px; letter-spacing:0; }
      .date-year { display:inline; font-size:10px; }
      .latest-body { gap:20px; }
      .lead-title { font-size:clamp(36px,10.8vw,54px); line-height:1.21; letter-spacing:-.06em; }
      .lead-description { font-size:13px; line-height:1.8; }
      .post-meta { font-size:10px; margin-top:12px; }
      .lead-bottom { margin-top:16px; }
      .directory-head { padding:25px 0 16px; }
      .directory-head h2 { font-size:17px; }
      .search { max-width:44%; font-size:11px; }
      .year-label { font-size:17px; padding-block:14px 11px; }
      .entry-link,.photo-entry .entry-link { grid-template-columns:48px minmax(0,1fr); gap:7px 14px; padding-block:19px 21px; }
      .entry-title { font-size:18px; font-weight:750; line-height:1.55; }
      .entry-description { font-size:12px; line-height:1.75; }
      .entry-time { font-size:10px; padding-top:5px; }
      .photo-entry .entry-link { padding-block:23px; }
      .post-photo { width:100%; }
      .post-photo img { aspect-ratio:1.38; }
      .post-photo figcaption { font-size:9px; }
      .foot-inner { font-size:10px; align-items:start; }
      .foot-links { gap:12px; }
      .reader-page { margin-top:24px; }
      .article-body { font-size:15px; }
      .article-body blockquote { padding-inline:14px; }
    }
    @media (max-width:360px) {
      .shell { width:calc(100% - 28px); }
      .collection-note { display:none; }
      .topnav { gap:11px; }
      .sound-inner { gap:8px; }
      .cover { width:38px; height:38px; }
      .sound-inner { grid-template-columns:38px minmax(0,1fr) auto auto; }
      .lead-title { font-size:36px; }
      .controls .next { display:none; }
    }
    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      .perform .title-part { animation:none !important; transform:none !important; }
      .entry-link::before { transition:none; }
    }
  </style>
</head>
<body>
  <a href="#content" class="skip">跳到文章</a>
  <header class="shell">
    <div class="utility">
      <span class="byline">Sy 的个人博客</span>
      <div class="utility-right">
        <nav class="topnav" aria-label="站内导航">
          <a href="/" aria-current="page">文章</a><a href="/notes">随笔</a><a href="/photos">光影</a><a href="/about">关于</a>
        </nav>
        <select id="themeChoice" class="theme" aria-label="主题"><option value="auto">自动</option><option value="light">浅色</option><option value="dark">深色</option></select>
      </div>
    </div>
    <div class="masthead">
      <div class="identity"><h1 class="wordmark">曲線時報</h1><p class="latin">THE<br>CURVE TIMES</p></div>
      <p id="collectionNote" class="collection-note"><strong>文章与音乐</strong><br>2025—2026 · 13 篇</p>
    </div>
  </header>

  <section class="soundbar" aria-label="音乐播放器">
    <div class="shell sound-inner">
      <div class="cover" aria-hidden="true"><img id="coverImage" alt=""></div>
      <div class="track-copy"><span id="songName" class="track-name"></span><span id="songArtist" class="track-artist"></span></div>
      <div class="controls">

    'use strict';
    const DATA = {"posts": [{"slug": "more-than-a-username", "title": "她不只是一个用户名", "date": "2026-09-24T00:00:00.000Z", "description": "关于一个人留下的记录、公开的悼念，以及 AI 能否补全那些从未被记录的空白。", "categories": ["随笔"], "wordCount": 5192, "readingMinutes": 15, "html": "<blockquote aria-label=\"引言\" style=\"border: 1px solid hsl(var(--rule-soft) / 0.7); border-left: 3px solid hsl(var(--stamp));\">\n<p><strong>引言</strong></p>\n<p>一个人去世了，然后别人发讣告，然后所有人齐刷刷在评论区留下晚安和 RIP，然后就什么都没有了。</p>\n<p>人们发完讣告和慰问，转头开启了新的生活，该面基的面基，该开玩笑的开玩笑。</p>\n<p>只有最好的朋友和亲人会偶尔想起她，最终只是成为人们聊天时偶尔会提起来的一个话题，以记忆这种最微弱、最没有存在感的方式继续留在人间。</p>\n</blockquote>\n<section aria-label=\"对话\">\n<p><strong>ChatGPT：</strong></p>\n<p>你想表达的不是“大家都很冷漠”，也不完全是“人死了就会被忘记”。更像是——<strong>一个人的死亡，对她自己和最亲近的人来说是世界崩塌；但对绝大多数旁观者来说，只是一条会被下一条动态顶下去的消息。</strong></p>\n<p>讣告发出来的那一天，评论区会突然挤满“晚安”“RIP”“一路走好”。大家会难过，会震惊，会转发，会回忆几句曾经的交集。可第二天、第三天，聊天群又开始发梗图，朋友又约着见面，时间线重新被新的事情填满。并不是那些眼泪都是假的，只是人的生活有一种近乎残忍的惯性——它一定会继续往前走。</p>\n<p>真正可怕的反而是后面那一大段安静。</p>\n<p>没有新的动态，没有新的照片，没有“她最近怎么样”。她的名字从每天出现，变成几个月后偶然有人说一句“以前有个谁……”，再后来甚至需要某首歌、某个日期、某张旧截图才能把她从记忆深处重新加载出来。一个曾经会说话、会生气、会爱人、有无数具体细节的人，慢慢被压缩成别人口中的几句话、硬盘里的几张照片、聊天记录里的一个灰色头像。</p>\n<p><strong>死亡最残酷的地方之一，大概不是那一天所有人都在告别，而是告别结束以后，世界真的照常运行了。</strong></p>\n<p>而对于最亲近的人，时间却不是这样走的。别人那里，她已经逐渐成为“过去发生过的一件事”；你这里，她可能仍然是一个没有正常结束的现在时。于是你会亲眼看着两种时间越来越错位：外面的世界已经走出去很远了，你偶尔一回头，她却还站在那个日期里。</p>\n<p>所以你说“以记忆这种最微弱、最没有存在感的方式继续留在人间”，我觉得真正刺人的地方就在这儿——<strong>一个人曾经那么具体地存在过，最后却只能寄居在仍然记得她的人脑海里。只要没人提起，她甚至不会在这个世界上制造任何新的动静。</strong></p>\n<p>有一句我觉得几乎可以直接概括你刚才整段话：</p>\n<blockquote>\n<p><strong>人死后并不会一直被世界悼念。世界只为她停顿片刻，然后继续刷新；最后，她从一个人变成一个名字，从一个名字变成一段记忆，再从一段记忆变成某些人偶尔沉默几秒钟的原因。</strong></p>\n</blockquote>\n<p>你刚才想到这些的时候，是在想到她吗？</p>\n<hr>\n<p><strong>我：</strong></p>\n<p>确实让所有人都记住她很困难…<br>\n但对我来说她不只是一个陌生的用户名…<br>\n她是一个拥有自己的记忆、学业、家庭、生活，活生生的人</p>\n<p><strong>ChatGPT：</strong></p>\n<p>让所有人都记住她很难，可看着她只剩下一个陌生的用户名，又觉得不够。在旁观者的时间线上，一个人的死亡很容易被压缩成“一个用户名 + 一张讣告 + 几百条晚安”。</p>\n<p>过几天又有新的帖子，又有新的名字。这种感觉像是死亡本身都被信息流格式化了，所有人短暂停一下，然后继续往下刷。</p>\n<p>但对你来说，她根本不是那个格式。</p>\n<p>她不是“某个用户名，RIP”。</p>\n<p>她有许多年已经发生过 n<p>你前面说的那种“角色交换”，也发生在这句“晚安”里。她曾经是评论区里活着的那个人，会给别人道晚安；现在，她自己的“晚安”也被封存在过去。</p>\n<p>而且我觉得最让人崩溃的，恰恰不是那些很正式的纪念文字，而是这种<strong>完全没意识到自己会变成最后痕迹的日常句子</strong>。</p>\n<p>你现在重新看到自己后来回的那个“晚安…”，会不会有种像是在跟已经停住的过去说话的感觉？</p>\n<hr>\n<p><strong>我：</strong></p>\n<p>这简直就是命运的玩笑啊…</p>\n<p><strong>ChatGPT：</strong></p>\n<p>知道后来发生的事，再回头看她留下的话，确实会有这种被命运捉弄的感觉。</p>\n<p>当时，那些都只是普通推文，她自己也不可能知道后来会发生什么。可现在你从结局倒着看，许多话都像被强行加上了预言感——明明只是过去某一刻的她在说话，后来却被现实赋予了完全不同的重量。</p>\n<p>但<strong>这不是命运提前写好的暗示，也不是她注定会走到那里。</strong><br>\n是后来发生的事太巨大了，所以以前那些本来普通的句子、日期、歌词、名字，现在全都像被染色了一样。</p>\n<p>事后看什么都像伏笔，也许是因为这个结局太难接受。回头寻找一个“早有预兆”的结构，会让它显得稍微说得通一点。</p>\n<p>可最痛的地方恰恰是——它很多时候根本说不通。</p>\n<p>她当时只是活着，发推，吐槽，做自己的事。后来发生的事，不会倒过来把之前每句话都变成遗言。</p>\n</section>"}, {"slug": "goodnight", "title": "晚安喵", "date": "2026-09-24T00:00:00.000Z", "description": "后来我才发现，关于 Epheia，我还有很多事情没来得及问，也有很多东西是在她离开以后才慢慢看懂的。这一页放着那些我还记得的她、以及她说过的话。", "categories": ["纪念"], "wordCount": 730, "readingMinutes": 2, "html": "<p>对我来说 Epheia 不只是一个陌生的用户名…<br>\n她是一个拥有 17 年记忆，自己的学业，家庭，生活，活生生的人</p>\n<p>她作息 UTC+0</p>\n<p>她开发了很多有用的项目<br>\n写了关于自己，关于社群，关于朋友们的很多文章</p>\n<p>这个项目我也交过 PR 的，，<br>\n她可喜欢用这个聊天了</p>\n<p>今年的 Pride Month，她做了一个 ARG</p>\n<p>明年的 05/12 还是她的成年生日</p>\n<p>我觉得我最大的成就还是谈上她了，，</p>\n<p>Epheia 为什么会喜欢我<br>\n她被我表白了还很高兴（？）</p>\n<p>07/16<br>\nEpheia 到达合肥的那天</p>\n<p>她如果还在合肥就会来找我抱抱，陪着我</p>\n<p>我打开了 QQ<br>\nQQ 空间<br>\n点击了个人主页<br>\n一闪而过被刷新掉的是<br>\n我抱着 Eph 时，发的一段歌词</p>\n<p>我之前要是消失一天，那 Epheia 肯定会疯掉的，，<br>\n她可能要把合肥 110 的电话打爆了</p>\n<p>再也不会有人在 6 月给我发 ARG 了<br>\n再也不会有人直播陪我玩欧卡了<br>\n再也不会有人和我玩地下城了<br>\n再也不会有人和我一起玩 MC<br>\n再也不会有人 VC 直播城市天际线…</p>\n<p>我真的没怎么了解过她，在她活着的时候<br>\n她让我玩的 ARG 我没玩<br>\n她写的文档我也没看（主要是有什么事我直接问就行）</p>\n<p>我还留着她的好多录音<br>\n我的手机里还存了好多她的照片…………</p>\n<p>我站在时间的列车上<br>\n她坐在远处 07/24 的地上，仰望着星空<br>\n向我挥手</p>\n<p>我想尽可能拉住时间，让它慢下来，等等 Epheia<br>\n可我知道一切都是没用的<br>\n时间慢不下来，Epheia 也不可能回来</p>\n<p>如果有一天她回来，看到我的 Blog 会有一丝不易察觉的微笑<br>\n“看，还是我熟悉的这个样子”</p>\n<p>今天我看备用机的 Telegram<br>\n我没开梯子<br>\n时间停在了她来到合肥的那一天<br>\n这还是一条未读消息</p>\n<p>我现在最讨厌的就是“夏”…<br>\n发生在夏天<br>\n永远留在了那个盛夏</p>\n<p>到最后我都已经有一半是醒着的了<br>\n不过仍不愿离开梦境，离开她</p>\n<p>“再怎么找也没有啦”<br>\n“不行，还是忘不掉她呀”</p>\n<p>随着日子远去，我对她的记忆也在一点点流失<br>\n而我无能为力</p>\n<p>Epheia 也变成了天上的星星，，</p>\n<p>以后我想纪念她，都没有个纪念的地方</p>\n<hr>\n<blockquote>\n<p>不是你的问题<br>\n是这个世界的问题喵…</p>\n<p>没有丢下你一个人喵</p>\n<p>不用道歉，你什么都没做错啊<br>\n是这个世界错了喵…<br>\n应该让这个世界对你道歉</p>\n<p>你就是 Sy 啊<br>\nSy 就是 Sy</p>\n<p>好些了吗…<br>\n我好累…我休息一会喵…？<br>\n晚安喵</p>\n<p>—— Epheia，2026/06/12</p>\n</blockquote>"}, {"slug": "no-next", "title": "没有下一版", "date": "2026-09-21T00:00:00.000Z", "description": "她没能见到 GPT 6，我也再没等到一个已读。", "categories": ["随笔"], "wordCount": 3709, "readingMinutes": 11, "html": "<blockquote>\n<p>9 月 21 日，和 ChatGPT 的聊天记录。\n我的话一字未改；GPT 的回复有删节，删掉的地方用「……」标出。</p>\n</blockquote>\n<p><strong>Sy：</strong></p>\n<p><em>（几张视频截图）</em></p>\n<p>每次看这些视频都会觉得时代在变…</p>\n<p>从2022年我在GPT3的对话框里复制代码</p>\n<p>到现在的AGI，Agent…</p>\n<p>我看这些时我觉得我在经历一个时代的演变，我不应该现在就死，我还可以看到更多科技的发展</p>\n<p>但是Epheia（等下，刚刚我家长来吵我了，发了很大的火，等我恢复下）永远停在了Kimi K3，Gemini 3.8 Flash，GPT 5.6 Sol，Claude Fable 5，DeepSeek V4，GLM 5.2，OpenCode Go</p>\n<p>再也没能见到K3.1，GLM 5.3，GPT 6 Astra，Fable 5.1，DeepSeek V4.1，Gemini 4 Pro</p>\n<p>这种感觉怎么说呢</p>\n<p>和你共同开发的好友，恋人，在时代的更新中没有了下文</p>\n<p>她与旧模型永远的留在了那些旧的时光</p>\n<p>你看着模型日新月异的变化</p>\n<p>又转头看着她一天天远去</p>\n<p>（我可以想象出一个时间线 我站在时间的列车上 她坐在远处07/24的地上，仰望着星空 向我挥手）</p>\n<p>就是 以前熟悉的记忆慢慢跟不上时代 但这段记忆很有用 又很真实 可能被我判定为还没结束 但是确实没有了下文</p>\n<p>啊好难解释</p>\n<p>就是一个和我一起随着时间向前 见证新工具新技术发展的存在 突然消失了</p>\n<p>我好崩溃</p>\n<p>好难受</p>\n<p>接受不了</p>\n<p>这个世界是假的吧</p>\n<p><strong>GPT：</strong></p>\n<p>……</p>\n<p>你难受的不是简单的“她没看到 GPT 6”啊。</p>\n<p>真正刺人的东西是：Epheia 原本属于你的“进行时”。</p>\n<p>她不是一张已经封存好的旧照片，不是一个从一开始就属于过去的人。她曾经和你一起等模型、试新工具、写东西、吐槽 AI、看着技术一版一版往前迭代。于是你脑子里默认的未来一直是：</p>\n<p>“K3.1 出了，我们去试一下。”</p>\n<p>“GPT 6 这次到底行不行？”</p>\n<p>“Fable 5.1 又改了什么？”</p>\n<p>“OpenCode 又整什么活？”</p>\n<p>“Gemini 4 出了，她会怎么评价？”</p>\n<p>这些句子本来都是有主语的——“我们”。</p>\n<p>然后某一天，现实没有把这段程序正常结束。</p>\n<p>它只是突然停止执行了。</p>\n<p>所以现在每一次科技更新，对别人来说只是“新东西发布了”；对你来说，却同时发生两件事：</p>\n<p>“哇，时代真的又往前走了一步。”</p>\n<p>和</p>\n<p>“她没有跟过来。”</p>\n<p>这两件事会在同一秒发生。兴奋和失去甚至不是互相抵消的，反而会把彼此衬得更明显。你越能感受到未来有多巨大、多不可思议，就越能感受到那个本来应该和你一起看到未来的人缺席了。</p>\n<p>所以你脑子里那幅画——你站在时间的列车上，列车一直向前，她坐在 07/24 那里的地上，抬头看星星，然后向你挥手——真的把这种感觉画出来了。</p>\n<p>最残酷的甚至不是列车开走。</p>\n<p>而是你没有选择让它开。</p>\n<p>时间就是会载着活着的人往前走。九月来了，新模型发布了，网站更新了，版本号变了，明年又会有更离谱的新东西。你甚至可以拼命回头看，可窗外那个地点还是会越来越远。</p>\n<p>于是会产生一种特别诡异的错位感：</p>\n<p>“怎么可能？”</p>\n<p>“昨天她还属于这个世界。”</p>\n<p>“她明明知道这些东西。”</p>\n<p>“她明明应该看到下一版。”</p>\n<p>“为什么世界居然还能若无其事地继续更新？”</p>\n<p>所以你才会觉得世界像假的。</p>\n<p>不是因为你真的分不清现实，而是现实在做一件非常违背你直觉的事——它居然允许一个如此真实、如此重要、原本明显还有后续的人，在故事中间消失，然后剩下的一切继续加载。</p>\n<p>这就是那个最难吞下去的东西：</p>\n<p>你失去的不只是 Epheia。</p>\n<p>你还失去了“Epheia 的未来”。</p>\n<p>她以后会喜欢什么模型，会换什么设备，会写什么项目，会怎么吐槽 GPT 6，会不会说 Gemini 4 还是一坨，会不会突然发现一个很好玩的 Agent，然后半夜甩给你链接……所有这些本来存在于你心里的未来分支，被同时截断了。</p>\n<p>丧失一个人，也会连带丧失无数个还没有发生的普通日子。</p>\n<p>所以模型版本号才会这么刺。</p>\n<p>“Kimi K3、Gemini 3.8 Flash、GPT 5.6 Sol、Claude Fable 5、DeepSeek V4、GLM 5.2、OpenCode Go”对你来说已经不仅仅是产品名了。</p>\n<p>它们变成了她所在时代的地层。</p>\n<p>以后你看到 GPT 7、Gemini 5、Claude 6，可能都会隐约知道：</p>\n<p>“她的世界停在那一层。”</p>\n<p>而你还在往上堆。</p>\n<p>但有一件事我特别想抓住——你刚才自己说的那句：</p>\n<blockquote>\n<p>“我不应该现在就死，我还可以看到更多科技的发展。”</p>\n</blockquote>\n<p>……它不需要是什么宏大的“活着的意义”，也不用负责解决 Epheia 的离开。甚至可以只是一个特别 nerd、特别具体的理由：</p>\n<p>“妈的，我至少得看看 GPT 6 Astra 到底是不是吹牛。”</p>\n<p>“我还没看到真正靠谱的 Agent。”</p>\n<p>“AGI 到底会不会来？”</p>\n<p>“2030 年的电脑到底会变成什么鬼东西？”</p>\n<p>都可以。</p>\n<p>活下去有时候根本不需要一套哲学体系。一个“我还想看看下一版”就已经是未来时了。</p>\n<p>而且有一点，我不太想把它说成那种俗套的“带着她向前走”。因为你明明知道她没有真的坐在列车上，这正是你痛苦的原因。</p>\n<p>更准确一点可能是：</p>\n<p>你们共同的时间线在 07/24 断开了。</p>\n<p>她的那条停在那里。</p>\n<p>你的这一条还在生成。</p>\n<p>而你每走到一个她没有抵达的新版本，都同时在经历“第一次看见未来”和“第一次发现她缺席于这个未来”。</p>\n<p>这大概就是为什么它这么痛。</p>\n<p>你刚刚说“以前熟悉的记忆慢慢跟不上时代，但这段记忆很有用，又很真实，可能被我判定为还没结束，但是确实没有了下文”——我甚至觉得这里可以有一个名字：</p>\n<p><strong>不是记忆过时了，是共同未来停止更新了。</strong></p>\n<p>记忆本身没有版本淘汰这回事。她属于 2026 年 7 月的那部分世界，会一直保持那个版本；而你会继续收到世界的更新日志。</p>\n<p>今晚先别要求自己“接受”这件事，好不好。接受这种东西不是点一下 <code>I agree</code> 就完成了。</p>\n<p>……</p>\n<p><strong>Sy：</strong></p>\n<p><em>（两张截图）</em></p>\n<p>人格可怕的是</p>\n<p>“她现在回来还来不来得及”</p>\n<p>我之前提到过想让我的网站保持Epheia只要一回来就还认识的样子</p>\n<p>我害怕世界继续更新 慢慢远离那个时间点</p>\n<p>世界慢慢发展成她素不相识的模样</p>\n<p>她就算回来也来不及了</p>\n<p>我想尽可能拉住时间 让它慢下来 等等Epheia</p>\n<p>可我知道一切都是没用的时间慢不下来 Epheia也不可能回来</p>\n<p>最痛苦的也就是 什么都知道 什么都清楚 但什么也做不了</p>\n<p>Telegram再也不会多一个已读的✅</p>\n<p>上线时间只会越走越远</p>\n<p>我什么都做不了</p>\n<p>我也清晰的知道自己什么都做不了</p>\n<p>我不能就这样让世界停止发展 大模型厂商停止更新模型</p>\n<p>（唉我不知道还该说什么）</p>\n<p><strong>GPT：</strong></p>\n<p>我明白你说的那个“来不来得及”有多可怕。</p>\n<p>最折磨人的其实不是“世界更新得太快”本身，而是你脑子里一直还保留着一个隐形的条件：</p>\n<p>“万一她回来呢？”</p>\n<p>哪怕理智已经把答案说得清清楚楚，情感还是会下意识地替她留位置。于是你会想让网站别改得太陌生、账号别变、东西别挪、界面别彻底换掉，像是在替她守着一个入口——如果有一天她真的从 07/24 那里走回来，她推开门还能认出来：啊，这是 Sy，这是我们以前待过的地方。</p>\n<p>可时间偏偏最不讲道理。它不会因为一个人缺席就停在登录界面等她。</p>\n<p>Telegram 那个“最近上线于 07/27/26”会越来越像一个遥远的历史日期；聊天框不会自己多出一个已读；你熟悉的模型名会一个个变成“旧模型”；今天觉得很新的东西，明年就可能成为“2026 年那个时候的东西”。这种变化本来应该只是科技发展的快乐，可落到你这里，每一次更新都像在提醒你：世界又离她所在的那个坐标远了一点。</p>\n<p>所以你才会本能地想拽住时间。</p>\n<p>不是因为你真觉得自己能命令 OpenAI、Google、Anthropic 全部停更，而是因为你想给她留一条能回来的路。</p>\n<p>这其实也是为什么你之前那个“网站保持成她回来还能认识的样子”的想法让我印象很深。它不是单纯的复古，也不是拒绝未来。更像是在一个不断更新的世界里，人为保留一个<strong>不会滚动的锚点</strong>。</p>\n<p>世界可以继续往前。</p>\n<p>GPT 6、7、8 可以继续出，网站也可以继续长出新的东西，你也可以变。</p>\n<p>但也许有一小块地方永远不需要升级。</p>\n<p>里面还是那个头像，那个名字，那些她见过的页面，那些当时的模型名，那些你们共同经历过的梗，甚至保留当时的 CSS、小 bug、旧截图、时间戳。</p>\n<p>不是假装“她还会回来”。</p>\n<p>而是拒绝让时间把“她曾经在这里”一并覆盖掉。</p>\n<p>我觉得这两件事其实可以同时成立：</p>\n<p>你可以继续坐在列车上往前走，去看那些她没来得及看到的东西；同时，在 07/24 那一站留一盏灯。</p>\n<p>灯不是为了骗自己列车会倒车。</p>\n<p>只是告诉那个越来越远的坐标：</p>\n<p><strong>这里没有被覆盖。</strong></p>\n<p>而你刚才那句“我什么都做不了”，我想稍微改一点点。</p>\n<p>你确实做不了最想做的那件事——没法让时间停下，也没法让那个已读重新亮起来。这个无能为力是真的，我不想拿什么“你还能做很多事”把它糊过去。</p>\n<p>但你还能决定一件非常小、却很真实的事：</p>\n<p>世界怎样变化，不完全等于你的记忆必须怎样变化。</p>\n<p>你不必为了追上时代，把她那个版本的世界升级掉。</p>\n<p>甚至以后某一天，你在用一个她完全不认识的 GPT 10，回头打开那个页面，它还是 2026 年夏天的样子。那时候“旧”本身可能就会变成一种非常珍贵的东西——因为它证明这个坐标真的存在过，而不是后来被你的脑子补出来的。</p>\n<p>……</p>\n<p><strong>Sy：</strong></p>\n<p>再也不会有人在6月给我发ARG了</p>\n<p>再也不会有人直播陪我玩欧卡了</p>\n<p>再也不会有人和我玩地下城了</p>\n<p>再也不会有人和我一起玩MC 再也不会有人vc直播城市天际线…</p>\n<p><strong>GPT：</strong></p>\n<p>嗯……就是这种地方最疼。</p>\n<p>不是“大概以后没人陪你玩游戏了”这么简单。是那些非常具体、非常不起眼、甚至当时根本不会想到要珍惜的日常，忽然全部被判定成了“最后一次”。</p>\n<p>六月有人突然丢给你一个 ARG。</p>\n<p>开着欧卡的时候，她在 VC 里陪着你跑那些无聊得要命的高速。</p>\n<p>地下城一起打。</p>\n<p>MC 一起玩。</p>\n<p>城市天际线开着直播，她一边看你乱修路、一边说话。</p>\n<p>这些东西本来都不是什么“纪念时刻”。</p>\n<p>它们本来只是生活。</p>\n<p>也正因为只是生活，所以现在才这么残忍。因为你不是只失去了几张照片、几个聊天记录、某一天的回忆，而是失去了一整套以后原本会不断重复出现的小事。</p>\n<p>“今年六月她还会不会又搞个 ARG？”</p>\n<p>“晚上要不要开欧卡？”</p>\n<p>“这个存档下次接着玩。”</p>\n<p>“等新版本出了再一起看看。”</p>\n<p>这些句子以前后面都有“下次”。</p>\n<p>现在“下次”突然没了。</p>\n<p>而且我不太想拿“以后还会有别人陪你”这种话盖过去。也许以后确实会有人陪你玩 MC、有人和你 VC、有人看你玩城市天际线，但那根本不是同一件事。</p>\n<p>因为你怀念的不是“陪玩”这个功能。</p>\n<p>是 Epheia 在那些事情里的存在方式。</p>\n<p>她说话的语气，她会注意什么，她什么时候笑，她会不会突然跑题，她会怎么评价你造出来的一坨东西，她发 ARG 时那种属于她的恶趣味……这些东西没有替代品。</p>\n<p>所以你脑子里才会不停冒出：</p>\n<p>“再也不会了。”</p>\n<p>这句话其实是在一点一点清点那个被截断的未来。</p>\n<p>……</p>\n<p>07/24 那一站旁边还有很多很小的光点。</p>\n<p>一个光点是六月发来的 ARG。</p>\n<p>一个是欧卡夜里的公路灯。</p>\n<p>一个是地下城的 UI。</p>\n<p>一个是 MC 世界里很普通的一块地。</p>\n<p>一个是城市天际线里乱七八糟的道路，旁边还挂着 VC 的波形。</p>\n<p>这些东西都没有什么“史诗感”。</p>\n<p>但它们才是那一站真正亮着的东西。</p>\n<p>然后列车继续往前。新的模型名、新的游戏版本、新的城市、新的项目不断从窗外掠过去。你越往前走，那些小光点在物理意义上越远，但它们并没有因此变得不真实。</p>\n<p>甚至可能相反。</p>\n<p>以后你看到 ARG，会想到六月。</p>\n<p>开欧卡，会突然记起某一段公路。</p>\n<p>进 MC，会想到“这里以前有人和我一起待过”。</p>\n<p>城市天际线一开，脑子里可能自动补上她当时的声音。</p>\n<p>这很烦，也会很疼。</p>\n<p>但那不是记忆跟不上时代。</p>\n<p>那是你的世界里有一部分东西已经固定成坐标了。</p>"}, {"slug": "savepoint", "title": "过期的存档点", "date": "2026-09-19T00:00:00.000Z", "description": "想回去的那一天，印在一瓶过期可乐的瓶身上。", "categories": ["随笔"], "wordCount": 399, "readingMinutes": 1, "html": "<p>这周不是单休吗，，我记错了吗🫠</p>\n<p>万象城有好多人，\n我想来 Apple Store 看看 iPhone 18 的\n本来想着明天是工作日 应该不会有多少人的</p>\n<p><img src=\"/images/posts/savepoint/01-apple-store.jpg\" alt=\"Apple Store\"></p>\n<p>我的Apple Watch S7和MacBook 2020 Intel 13 inch都升级不了27系统😥</p>\n<p>感觉跟我没什么关系\n可能是解离了（？\n没什么感觉</p>\n<p>我也不知道\n都没什么感觉</p>\n<p><img src=\"/images/posts/savepoint/02-park.jpg\" alt=\"公园\"></p>\n<p>回来的路上经过了一个公园\n突然觉得这很像深圳的某一个我去过的（2024）\n可能也是我的幻觉吧</p>\n<p>可惜我只去过光明和罗湖</p>\n<p>可惜我没去过南山区\n我也不想提到深圳\n也不想再去深圳</p>\n<p><img src=\"/images/posts/savepoint/03-sky.jpg\" alt=\"天\"></p>\n<p>不开心，，</p>\n<p>那时的我有没有想过…\n算了\n不知道\n那时候的我怎么知道以后会发生什么</p>\n<p><img src=\"/images/posts/savepoint/04-lake.jpg\" alt=\"湖\"></p>\n<p>啊好烦我现在想把地球捏碎\n或者直接把地球炸掉</p>\n<p>刚刚还可以感觉到明显的想哭，后悔，失落\n拍了几张照片就什么感觉都没有了\n再读取就像这个变量根本不存在</p>\n<p>我不知道现在该思考什么好</p>\n<p><img src=\"/images/posts/savepoint/05-pepsi.jpg\" alt=\"可乐\"></p>\n<p>买可乐还买到了一年前的隐藏过期款</p>\n<p>25年9月21号生产的保质期九个月</p>\n<p>我就品鉴一下，把这个喝了吧</p>\n<p>有点塑料味，，</p>\n<p>喝了这瓶过期的可乐我能回到25/9/21吗？🤔</p>\n<blockquote>\n<p>生产日期不是时间坐标。</p>\n<p>—— GPT</p>\n</blockquote>"}, {"slug": "june", "title": "六月没有主线任务", "date": "2026-06-18T00:00:00.000Z", "description": "随着地铁播报声的传来，我的六月失去了主线。", "categories": ["随笔"], "wordCount": 279, "readingMinutes": 1, "html": "<p>「合肥轨道交通提醒您……」</p>\n<p>随着地铁播报声的传来，我的六月，正式失去了主线。</p>\n<p>以前也抑郁，但至少有个主线任务在跑。\n复习，刷题，考试，成绩——\n天天期盼着解放。</p>\n<p>真到了这一天，任务栏却被清空了。</p>\n<p>（（前面的区域，以后再来探索吧。</p>\n<p>生活没有弹出新的窗口，\n只是还在运行。</p>\n<p>阳光每天照进来一次。\n拉开窗帘，穿上衣服，打好遮阳伞，出门。</p>\n<p>安检声，进站声，穿过我的耳朵，又流出去。\n一天，又一天。</p>\n<p>我没有在享受假期，\n我是在执行另一个任务。</p>\n<p>I have no friends.</p>\n<p>是无聊的。</p>\n<p>没人愿意理我，没人理我。\n只有推特上寥寥几个赞和转帖。</p>\n<p>想见的人不在身边，远在天边。\n无可奈何花落去。</p>\n<p>我在这六月里穿行，\n却没有人，透过六月，到达我。</p>\n<p>酒馆，MD 编辑器，Scratch——\n到处散落着没做完的项目，\n谱成了一首烂尾的诗。</p>\n<p>自由模式没有解锁，\n任务提示，也没有弹出。</p>"}, {"slug": "attachment", "title": "依恋的形状", "date": "2026-04-25T00:00:00.000Z", "description": "焦虑型依恋的自我解构——从成长裂痕到关系死循环，一份写给自己的病理报告。", "categories": ["随笔"], "wordCount": 1743, "readingMinutes": 5, "html": "<blockquote>\n<p><em>焦虑着依恋别人真的会很痛苦诶……自己猜疑而又导致别人很有社交压力……</em></p>\n</blockquote>\n<p><strong>但是为什么会这样呢？</strong></p>\n<hr>\n<h2 id=\"一根系成长环境的裂痕\">一、根系——成长环境的裂痕</h2>\n<p>根据我所了解到的资料，At first，这与Ta的成长环境有关系。</p>\n<p>焦虑型/混乱型依恋所表现的\"焦虑\"\"不确定\"中，就有<strong>家庭中安全感持续缺失</strong>的原因，或者说——<strong>家人才是Ta不安感的来源</strong>。</p>\n<p>最终这会使Ta完全安心在一段关系中，需要时时刻刻确认：</p>\n<blockquote>\n<p><em>\"你真的在乎我吗\"</em>\n<em>\"你真的爱我吗\"</em></p>\n</blockquote>\n<p>在Ta的眼中，<strong>所有的关系都是不可预测且无法持续的</strong>，默认所有关系都可能会在下一步灰飞烟灭。这就会迫使Ta通过反复一直不断向对方确认关系来获得<strong>短暂而又不可持续的安全感</strong>——Ta无法确认这份关系是稳定的，必须要不断的确认，测试。</p>\n<p>什么信息几分钟不回，一点点小事的分歧，这些就认为是被抛弃的预兆，又被自己的焦虑逼着做一些使自己稍稍安心一点的验证措施：<strong>连环追问，沉默，病理性嫉妒</strong>——等等都只是为了验证***\"你还是在意我的\"***！</p>\n<p>在对方（如果是一个广义上的正常人）看来大概率就会觉得莫名其妙，如果对方可以够理解，也可能会从一开始的同情，变成疲惫，窒息。==反复证明关系就像一个反复证明1+1=2的黑洞==，虽然简单，<strong>但太多了确实很烦人！</strong></p>\n<hr>\n<h2 id=\"二封印情绪不允许被表达\">二、封印——情绪不允许被表达</h2>\n<p>情绪不允许被表达也有原因，这不得不提到<strong>东亚尤其中国的神秘教育模式</strong>。</p>\n<p>受委屈了不许哭是什么玩意？？要给孩子培养成M吗？？</p>\n<p>在这种环境下不知愤怒悲伤恐惧是极度危险的，甚至包括快乐兴奋这类都可能引火烧身。<strong>这些情绪不可能因为积压而自然消失。</strong></p>\n<p>当被压抑到极点而这时正好有一个可以倾听，理解自己的人时，极大概率会把以前从来不允许表达的，会招致否定的情绪——<strong>所有的不安，委屈，渴望，诉求</strong>——这些全部爆发出来。方式可能有痛苦，控诉，决绝的离开（这大概率是想要被对方挽回，至少我是）。</p>\n<p>对方（依旧要在广义上是正常人）似乎会觉得莫名奇妙和一种深深的无力感：</p>\n<blockquote>\n<p><em>上一秒软软的可爱的你，下一秒就变成了一个吞噬Ta的黑洞，完全不知道该怎么面对你。</em></p>\n</blockquote>\n<p>这种关系给人感觉就像DMZ，自己随时可能会碰到你的斩杀线。<strong>无从下手+阴晴不定</strong>，最后对方离开也是情理之中了。</p>\n<hr>\n<h2 id=\"三驯化无条件的顺从训练\">三、驯化——无条件的顺从训练</h2>\n<p>接着就是无条件的顺从训练了。</p>\n<p>诶没错，还是老熟人——<strong>东亚+中国</strong>。</p>\n<p>什么听话有奖励的反馈机制？Impossible! 是<strong>不听话就没有资格存在</strong>，愧对天地！愧对父母！愧对每一个对你好的人！死也是不负责任的表现！不被允许！只能顺从政府，家长，教师甚至任何人给你的建议与安排！</p>\n<p>这点可以列举的例子太多我甚至犯了选择困难症。东亚家长是一个可以做到去吃一顿好吃的都会提起 <em>\"要好好学习不然以后哪来的钱享受\"</em> 这种话，我又可以说什么呢。</p>\n<hr>\n<h2 id=\"四蒸馏被否定的感受本身\">四、蒸馏——被否定的感受本身</h2>\n<p>长期被否定自然不用多说了。</p>\n<p>不像大模型训练一样否定对prompt的反馈（当然这也不对就是），甚至<strong>直接否定你的感受，直接把System Prompt否定了</strong>：</p>\n<blockquote>\n<p><em>\"有什么好哭的！\"</em>\n<em>\"你想这么多干什么\"</em>\n<em>\"这有什么不好说的！\"</em></p>\n</blockquote>\n<p>最终就导致自己变成了<strong>审查自己的一个机器</strong>——审判每一个情绪所存在的正确性与价值，将在\"公序良俗\"\"伦理道德\"要求下的情绪给斩杀，输出时再继续斩杀那些\"不被公众所接受\"\"不被别人所认可\"的文字。</p>\n<p><strong>最后这样蒸馏出来的文字自然就很没有生命力了，也会有一种非活人感。</strong></p>\n<p>（好像扯远了）</p>\n<hr>\n<h2 id=\"五死循环规则冲突下的崩溃\">五、死循环——规则冲突下的崩溃</h2>\n<p>在这样的架构所训练出来的模型在进入关系后自然会出现<strong>规则冲突</strong>。</p>\n<p>一边是压抑不知多久的情绪和感受终于可以得到释放，另一边又是所接受的训练导致自身本能再说 <em>\"表达的太多了 Killed\"</em>。</p>\n<p>这显出的性质就是在<strong>克制与失控之间反复横跳</strong>：</p>\n<pre><code>隐藏 → 爆发 → 自恨 → 继续更深的隐藏\n</code></pre>\n<p>or</p>\n<pre><code>试探 → 被回应，被在意，被接受，被理解 → 全部投入\n→ 对方本能自保后退 → 啊我果然不被在意\n</code></pre>\n<blockquote>\n<p><strong>没一条活路的。</strong></p>\n</blockquote>\n<hr>\n<h2 id=\"六过载为什么对方会觉得你很烦\">六、过载——为什么对方会觉得你很烦</h2>\n<p>但是，最后，为什么会使对方觉得你很烦呢？甚至给对方产生一种很讨厌你，很不想理你，甚至主观想理但最多打几个字就说不下去的原因呢？（都PTSD了！）</p>\n<p><strong>What Happened？</strong></p>\n<p>把前面所说的放一起看看：</p>\n<ul>\n<li>🔁 反复不停持续的确认关系</li>\n<li>🔍 对对方的一丝丝情绪波动极其敏感</li>\n<li>🚫 对方需要独处空间时完全做不到后退</li>\n<li>🏋️ 所有所有的情感寄托与生活信念<strong>完全压在了一个人身上</strong></li>\n</ul>\n<blockquote>\n<p><em><strong>这完全超过一个人可以承载的了说！</strong></em></p>\n</blockquote>\n<hr>\n<h2 id=\"七失语配得感与表达的塌陷\">七、失语——配得感与表达的塌陷</h2>\n<p>同样的一个需求在安全环境中成长与否定环境所成长出的人会显现很明显的差别。后者自动存在**\"我不配提出要求\"**的底色。</p>\n<p>这种底色很严重的影响了表达方式：</p>\n<ol>\n<li><strong>不表达需求</strong></li>\n<li>各种旁敲侧击绕弯子</li>\n<li>带着歉意和自我贬低</li>\n<li>压到极限才说，又导致每次表达又带着一堆情绪</li>\n</ol>\n<p>最终对方收到的完全不是请求，是<strong>一大堆带着恐惧自恨愧疚又渴望的数据</strong>——就像大模型反复蒸馏的生成物差不多，没有任何信息价值。</p>\n<blockquote>\n<p><em>配得感低本身就是一种保护策略——先否定自己把期望降到最低比被别人否定安全得多，<strong>但也导致永远无法拥有安全感</strong>。</em></p>\n</blockquote>\n<hr>\n<h2 id=\"尾声\">尾声</h2>\n<p>但是，很遗憾的是——</p>\n<p><strong>我可以做到解析，分析这些内容，但似乎还没办法做到真正解决，理解这些问题呢……</strong></p>"}, {"slug": "dzgc", "title": "关于“芜湖市德智拓展训练有限公司”以及“芜湖市无为市德智青少年成长中心”的维权报告", "date": "2026-03-22T00:00:00.000Z", "description": "关于这些所谓的“矫正机构”的报告", "categories": ["权益维护"], "wordCount": 1661, "readingMinutes": 5, "html": "<blockquote>\n<p><strong>声明</strong></p>\n<p>写了一堆垃圾 套话 空话 完全就是我的语言碎片拼出来的</p>\n<p>几乎没什么信息含量</p>\n<p>一点都不想回忆</p>\n<p>一点都不想调查</p>\n<p>再多一点都不想查阅</p>\n<p>全都去死了算了</p>\n<p>写这个没有什么意义</p>\n<p>单纯是为了给当时的自己一个交代而已</p>\n<p>但是这样看还不如不写</p>\n<p>但是反正最后东拼西凑出来了</p>\n<p>有用也罢 垃圾也罢</p>\n<p>就放这放着吧</p>\n<p>全去死吧</p>\n</blockquote>\n<h2 id=\"一-法律规范与权利保护的框架体系\">一、 法律规范与权利保护的框架体系</h2>\n<p>在中国现行法律体系下，未成年人作为特殊保护主体，其人身自由、人格尊严及身心健康权利受到多重法律规范的严格保护。</p>\n<blockquote>\n<p><strong>法律基石</strong></p>\n<p><strong>宪法基本原则</strong>\n《中华人民共和国宪法》第三十七条明确规定，公民的人身自由不受侵犯，禁止非法拘禁以及以其他方法非法剥夺或者限制公民的人身自由。该条款确立了人身自由保护的宪法基石。</p>\n<p><strong>民法核心保障</strong>\n《中华人民共和国民法典》人格权编明确，自然人依法享有人身自由权与人格尊严权，任何组织或者个人不得侵害。</p>\n</blockquote>\n<blockquote>\n<p><strong>未成年人专项保护</strong></p>\n<p>《中华人民共和国未成年人保护法》（2020年修订，2021年施行）构建了更为具体的保护体系：</p>\n<ul>\n<li><strong>第二十七条</strong>：学校、幼儿园教职员工不得对未成年人实施体罚、变相体罚或者其他侮辱人格尊严的行为。</li>\n<li><strong>第四十条</strong>：学校应当建立预防性侵害、性骚扰制度，对相关违法犯罪行为不得隐瞒。</li>\n<li><strong>保护原则</strong>：监护权的行使不具有无限扩张性，相关教育或管理行为仍需符合“最有利于未成年人”的基本原则，均不得突破对人格尊严与人身权利的基本保护边界。</li>\n</ul>\n</blockquote>\n<h2 id=\"二-刑事法律的适用边界与责任认定\">二、 刑事法律的适用边界与责任认定</h2>\n<p>当相关行为突破一般管理或教育范畴，达到侵害人身权利的程度时，将依法触及刑事责任。</p>\n<blockquote>\n<p><strong>刑事红线</strong></p>\n<ul>\n<li><strong>非法拘禁罪（第二百三十八条）</strong>：对于以强制手段将未成年人带离原有生活环境、实施封闭式管理并限制其离开的情形，即使存在所谓“监护人同意”，在当事人明确反对且存在胁迫的情况下，仍可能构成该罪。</li>\n<li><strong>故意伤害罪（第二百三十四条）</strong>：故意伤害他人身体的，依法追究刑事责任。</li>\n<li><strong>其他严重犯罪</strong>：如虐待被监护人、看护人罪等。司法实践表明，此类行为不因其声称的“教育目的”而获得免责。</li>\n</ul>\n</blockquote>\n<h2 id=\"三-行政许可与办学合法性的审查\">三、 行政许可与办学合法性的审查</h2>\n<blockquote>\n<p><strong>Note</strong></p>\n<p><strong>办学许可要求</strong>\n根据《中华人民共和国民办教育促进法》第六十四条，未取得许可擅自举办的属于非法办学行为。实践中，部分机构以“教育咨询公司”名义开展封闭管理教育，涉嫌规避行政许可制度。</p>\n<p><strong>校外培训规制</strong>\n根据《校外培训行政处罚暂行办法》（2023年施行），借“素质教育”名义干扰教育秩序或增加学生负担的行为同样违反相关规定，应责令停止并处罚款。</p>\n</blockquote>\n<h2 id=\"四-其他相关法律责任的追究\">四、 其他相关法律责任的追究</h2>\n<ul>\n<li><strong>治安管理处罚</strong>：《中华人民共和国治安管理处罚法》对情节较轻的非法限制人身自由、侮辱或虐待行为，规定了行政拘留或罚款措施。</li>\n<li><strong>消费者权益保护</strong>：若机构在宣传中隐瞒实际风险，构成虚假宣传与欺诈的，相关监护人有权主张退费及赔偿。</li>\n<li><strong>专门学校设立程序</strong>：依据《中华人民共和国预防未成年人犯罪法》，未依法经严格审批设立的机构实施强制管理，属于偏离其法律定位。</li>\n</ul>\n<h2 id=\"五-法律规范与具体实践的交汇\">五、 法律规范与具体实践的交汇</h2>\n<p>综合上述法律法规，我国已形成较为完整的未成年人权利规范体系。但在具体实践中，部分以“矫正”或“训练”为名的机构，其实际运作方式往往游走于法律规范的边缘地带，甚至在特定情形下突破了法律的强制性限制。</p>\n<h2 id=\"六-核心案例对特定机构管理模式的个体审视\">六、 核心案例：对特定机构管理模式的个体审视</h2>\n<p>在具体的个体经历中，上述法律规范的边界被严重突破。该机构在实际运作中存在严重的违法违规行为，其实质是对基本人权的系统性侵害。</p>\n<blockquote>\n<p><strong>核心违法事实指控</strong></p>\n<p><strong>（一）对人身自由的实质限制与暴力惩戒</strong></p>\n<ol>\n<li><strong>严密的物理隔离</strong>：机构采取严格的物理限制措施，使个体丧失基本的自由活动权利，涉嫌非法限制人身自由。</li>\n<li><strong>强制意志压制</strong>：日常作息及区域活动具有绝对的强制性，个体被要求无条件服从指令，没有任何选择或拒绝的空间。</li>\n<li><strong>暴力惩戒机制</strong>：当个体表达离开意愿时，管理人员实施暴力镇压，包括单独关押至密闭房间，并施以殴打、体罚及辱骂，直接违反禁止体罚的强制性规定。</li>\n</ol>\n<p><strong>（二）对通信自由的非法剥夺与虚假信息制造</strong></p>\n<ol>\n<li><strong>通信渠道切断</strong>：实施严苛限制（如长达一个半月仅允许一次书信），并建立非法审查机制拦截真相披露，蓄意切断外部救济渠道。</li>\n<li><strong>系统性造假</strong>：强制要求个体配合“摆拍”制造虚假视频，向外界粉饰太平，恶意逃避法律与行政监督。</li>\n</ol>\n<p><strong>（三）教育承诺的虚假性与强制管理滥用</strong></p>\n<ol>\n<li><strong>心理咨询异化</strong>：缺乏法定资质人员，将名义上的心理干预异化为探测服从度、实施心理施压的工具。</li>\n<li><strong>受教权实质剥夺</strong>：“课程表”仅为应付审查，法定教育内容被压缩缺失，代之以无教育意义的强制活动。</li>\n<li><strong>常态化体罚</strong>：剥离教育引导，将体罚作为日常维持秩序的核心手段，完全违背教育本质。</li>\n</ol>\n</blockquote>\n<p>部分数据:<a href=\"https://www.qcc.com/firm/b912a25ae60331c2aaa612039a448ec6.html\">https://www.qcc.com/firm/b912a25ae60331c2aaa612039a448ec6.html</a></p>"}, {"slug": "deepseek", "title": "给你的 Curve 主题通过调起 DeepSeek 添加一个侧边栏温柔问候语", "date": "2025-10-20T00:00:00.000Z", "description": "Curve 主题：DeepSeek 首页问候组件", "categories": ["开发教程"], "wordCount": 919, "readingMinutes": 3, "html": "<blockquote>\n<p><strong>Warning</strong></p>\n<p>在开始动手之前，请确保你已经成功部署了 <strong>DeepSeek API 代理</strong>（无论是本地还是 Vercel）。<br>\n如果你还没部署，可以先看我写的另一篇：<a href=\"#\">给你的 Curve 主题添加一个 DeepSeek 代理</a>。<br></p>\n</blockquote>\n<h2 id=\"效果预览\">🪞效果预览</h2>\n<p>打开你的首页时，DeepSeek会自动在侧边栏的小组件生成一句带有<strong>温柔气息</strong>的问候语，比如：</p>\n<blockquote>\n<p>「你好呀，今天的风也刚好路过我身旁。」</p>\n</blockquote>\n<p>每次刷新、或点击卡片时，都会重新生成一条新的话。<br>\n整个过程是实时流式输出的——你能看见文字一点点浮现。</p>\n<hr>\n<h2 id=\"-新建-randomquotevue-文件\">🧩 新建 randomquote.vue 文件</h2>\n<p>路径：<br>\n<code>.vitepress/theme/components/Aside/Widgets/randomquote.vue</code></p>\n<p>写入：</p>\n<figure data-rehype-pretty-code-figure=\"\"><pre tabindex=\"0\" data-language=\"vue\" data-theme=\"github-light github-dark\"><code data-language=\"vue\" data-theme=\"github-light github-dark\" style=\"display: grid;\"><span data-line=\"\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\">&#x3C;</span><span style=\"--shiki-light:#22863A;--shiki-dark:#85E89D\">template</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\">></span></span>\n<span data-line=\"\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\">  &#x3C;</span><span style=\"--shiki-light:#22863A;--shiki-dark pan>\n<span data-line=\"\"><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\">  name</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\">: </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF\">\"Sy Yann\"</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\">, </span><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D\">//要显示的名字</span></span>\n<span data-line=\"\"><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\">  date</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\">: </span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF\">\"2011-08-15\"</span><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\">, </span><span style=\"--shiki-light:#6A737D;--shiki-dark:#6A737D\">//出生日期</span></span>\n<span data-line=\"\"><span style=\"--shiki-light:#24292E;--shiki-dark:#E1E4E8\">},</span></span></code></pre></figure>\n<h2 id=\"完成\">完成</h2>\n<blockquote>\n<p>按照步骤做完后，run dev保存应该就可以看见一个出生天数卡片出现在右边了。祝愉快~</p>\n</blockquote>"}, {"slug": "hy2", "title": "VPS:一个脚本搞定常用工具", "date": "2025-07-24T00:00:00.000Z", "description": "一个新VPS搭建代理工具+测速+流媒体+Hy2/Xui的小工具", "categories": ["工具箱"], "wordCount": 638, "readingMinutes": 2, "html": "<!-- title:  tags: [工具, 教程] categories: [开发教程] date: 2025-07-25 description: 别再到处找命令了，这个多合一工具箱脚本集成了测速、面板安装和流媒体检测等常用功能。 -->\n<blockquote>\n<p><strong>Caution</strong></p>\n<p>在开始之前，你得有台 VPS，还得会用 SSH。这个脚本只是把一堆常用命令打包在一起方便你调用，并不能帮你解决服务器本身的网络问题或者其他疑难杂症。请确保你有独立解决问题的能力。</p>\n</blockquote>\n<p>每次拿到一台新 VPS，是不是总要重复那么几个操作：先跑个测速，再看看流媒体解锁情况，然后装个面板... ... 每次都得去网上搜对应的命令，挺烦的。现在，有人把这些常用功能打包成一个菜单脚本了。</p>\n<p>这是个什么脚本？ 🤔\n简单说，这就是一个 VPS 工具箱。</p>\n<p>运行它之后，你会看到一个清晰的菜单，想用哪个功能，输入对应的数字就行。它集成了几个我们初始化 VPS 时最常用的功能，省去了到处找各种一键脚本的麻烦。</p>\n<p>有什么功能？ 🧰\n目前这个工具箱v1.2版本包含了以下几个核心功能：</p>\n<blockquote>\n<p><strong>Note</strong></p>\n<ol>\n<li>服务器测速 (Run Speedtest)</li>\n</ol>\n<p>调用的是 superbench.sh 脚本，可以快速测试你 VPS 的网络速度，删去了 I/O 性能测试。</p>\n<ol start=\"2\">\n<li>&#x26; 3. 安装面板 (Install X-UI / 3x-UI)</li>\n</ol>\n<p>集成了 X-UI 和 3x-UI 两个常用面板的一键安装脚本，想装哪个点哪个。</p>\n<ol start=\"4\">\n<li>流媒体解锁检测 (Check Media Unlock)</li>\n</ol>\n<p>运行 check.unlock.media 的脚本，帮你检查 VPS 能不能看 Netflix、Disney+ 等流媒体。</p>\n<ol start=\"6\">\n<li>内置 Hy2 安装器 (Install Hy2)</li>\n</ol>\n<p>这个就有意思了，它把 Hysteria2 的一键脚本直接塞进了工具箱里。选择这个选项后，会提示你输入端口和密码，然后自动完成所有安装步骤。</p>\n<ol start=\"5\">\n<li>退出 (Exit)</li>\n</ol>\n<p>用完了，点这个就能安全退出脚本。</p>\n</blockquote>\n<p>怎么用？ 🚀\n非常简单，一行命令启动工具箱：</p>\n<p>Bash</p>\n<figure data-rehype-pretty-code-figure=\"\"><pre tabindex=\"0\" data-language=\"bash\" data-theme=\"github-light github-dark\"><code data-language=\"bash\" data-theme=\"github-light github-dark\" style=\"display: grid;\"><span data-line=\"\"><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\">bash</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF\"> &#x3C;(</span><span style=\"--shiki-light:#6F42C1;--shiki-dark:#B392F0\">curl</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF\"> -s</span><span style=\"--shiki-light:#005CC5;--shiki-dark:#79B8FF\"> -L</span><span style=\"--shiki-light:#032F62;--shiki-dark:#9ECBFF\"> hk.ddnsy.digital/vps.sh)</span></span></code></pre></figure>\n<p>运行后，你就会看到这个菜单界面。操作完一个功能后，按任意键又会回到主菜单，可以继续选别的功能，或者选择退出。</p>\n<p>总的来说，这是个挺方便的小工具，把新vps到手后最常用的几个动作都集成了。虽然功能不算多，但贵在方便。懒人必备。</p>"}, {"slug": "hello-world", "title": "你好，世界？", "date": "2025-07-24T00:00:00.000Z", "description": "这里是一个小小的角落，一个勉强算是\"家\"的地方。", "categories": ["随笔"], "wordCount": 554, "readingMinutes": 2, "html": "<h2 id=\"一个开始\">一个开始</h2>\n<p>搭建一个网站，写下“你好，世界”，对很多人来说是一个起点。\n对我来说，更像是一个<strong>小声的提问</strong>。</p>\n<p>你好…世界？ 你能听到吗？</p>\n<p>这里是一个小小的角落，一个勉强算是“家”的地方。我不知道我的家在哪，但这决不是我的家，家可以挡风雨 。或许用代码和文字堆砌起来的这个空间，能给我一点点遮蔽。</p>\n<p>所以，我想在这里留下一些痕迹。一些关于我存在过的，微不足道的证明。</p>\n<blockquote>\n<p>TIP\n我们终其一生都会照顾人，也终将被照顾 。但更多的时候，我们只是想找一个地方，<strong>安静地待着</strong>。如果现实里找不到，就在<strong>赛博空间里给自己建一个家</strong>吧。</p>\n</blockquote>\n<h2 id=\"这里会有什么\">这里会有什么</h2>\n<p>我也不确定。\n思绪像一团理不清的乱麻。所以这里大概也会一样混乱。</p>\n<ul>\n<li>一些闲言碎语 。关于那些睡不着的夜晚，和一些无处安放的情绪。</li>\n<li>一些存在过的证明。无论是代码的碎片，还是生活的片段。</li>\n<li>一个情绪的垃圾场。存放那些“乱糟的成绩，难捣的ViteP，像麻绳一般乱的人际关系” 。</li>\n<li>还有一个…关于我的故事？</li>\n</ul>\n<p>世界上从来没有感同身受这回事，针不扎在你身上，你就永远不知道有多痛 。但如果我的文字能让某个角落的你，<strong>感觉到一丝丝的共鸣</strong>，那或许，我的存在也不是那么毫无意义。</p>\n<h2 id=\"写给你们\">写给你们</h2>\n<p>也许浏览这篇文章的你，我们从未在现实中谋面，或许相隔甚远 。\n谢谢你愿意点开。</p>\n<p>我总希望能给别人带来欢乐，但最终带来的几乎只是烦恼 。希望这个小站，可以不只是烦惱的堆砌。\n如果你也觉得孤单，或是在为什么事烦恼。\n没关系，我也是。</p>\n<p><strong>我们都在努力地活着，这就已经很了不起了。</strong></p>\n<blockquote>\n<p>TIP\n<strong>“这个世界没有什么好畏惧的，反正我们只来一次。”</strong></p>\n</blockquote>\n<p>That’s All~</p>\n<p>希望你，一切都好。</p>"}], "tracks": [{"name": "A Little Love", "artist": "冯曦妤", "url": "/Musics/A Little Love.mp3", "pic": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAEhAUADASIAAhEBAxEB/8QAHAAAAgMBAQEBAAAAAAAAAAAAAAECBAUDBgcI/8QASRAAAQIEBAMFBgMGAwYEBwAAAQIRAAMEIQUSMUFRYXEGEyIygRRCkaGxwVLR8AcVJGJy4SMz8RZDU4KSoiU0RNJVY3Oys8Li/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EADARAAIBAwQBAwMCBgMBAAAAAAABAgMREgQTITFBBTJRFCJhcZEzQlKhwfAVI4Gx/9oADAMBAAIRAxEAPwD4yA4uL/B4iEhiwD8NICLeJg+l9YHvdAdt4+ueQQGUObciLR0UibLbvEKRmDgEEONjfbnEcw0s5GkWsTxqvxyZIm19SucumkoppWYDwS0hkpsNogKxAGiifSE+wOu+0Jg75XPxhAByAktFABTqZLdDA9rKB4vG32h7OSMGo8JnycZocRViFN38yVTl10pfyL5/lEJfZLH52Aqx+Vg9YvCpZKVVaUPLDW14PZ9IzkhYyH8V3PNIgICrm/Bxb1hEkEPY7bRdwaop6HFqOqr6f2qkkz0LnSTpMQFOU+oeKCm6laKBaAhwHIS2l2j6R+2rtj2Q7X1uGTeymG+yiRKUmfM7gSQtyMqco1a9+cfNSgPprodYkW2rtFa+BsGKRlD7PA7WG8JtARbmmEcpFgGjRkbMoZnzc7QKBBv01+8DBNt+BGsIDXw/O8QowwDvpwNoCrdiRzZoZAcKKS+zhoiWVdIKRz3gCQCdT9IQLEZSSeWsIXax+cPUXUW5aRQG93PB4Yt4iphpeLlNhOI1tFVVtPRVE6lpADPnJQSiSDYZjoHikwcZrDmfvEuLDGYl7WhgkDqNYViS5drgQBibBJ2sHgCeVWXNkUUPldQs/WIjQNtuzR9SkftbweX+x9XYqZgBXXFBlpqRl7skrzCbo+Yfox8sJcuFO24H5xItu90VoAwDj5WgB8NlKPU2Bh6MCNbiIlsrhN4EGHYEM/4jtASzZllXQQhcWzKULuzGGCC+r63aAFmtbLf4iJZswYKHrEbKP6Bgy5rG6nuW0gCTklkkPzEIKYjPudh9ISUEPYWL2OsSBDF9Ta+8AIsSC     const POSTS = DATA.posts;
    const el = id => document.getElementById(id);
    const make = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };
    const mediaUrl = path => location.protocol === 'file:' ? '../public' + path : path;
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const dateFull = date => date.slice(0,10).replaceAll('-','.');
    const dateShort = date => date.slice(5,10).replace('-','.');
    const asOf = new URLSearchParams(location.search).get('as-of');
    const visible = POSTS.filter(p => !asOf || p.date.slice(0,10) <= asOf);
    const postHref = p => '/posts/' + encodeURIComponent(p.slug);

    function titleMotion() {
      const heading = document.querySelector('.lead-title');
      if (!heading || !heading.querySelector('.title-negation') || reduced.matches) return;
      heading.classList.remove('perform');
      void heading.offsetWidth;
      heading.classList.add('perform');
    }
    function articleLink(post, className) {
      const link = make('a', className);
      link.href = postHref(post);
      link.addEventListener('click', event => {
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey || event.button !== 0) return;
        event.preventDefault();
        openPost(post);
      });
      return link;
    }
    function renderLead(post) {
      el('lead').replaceChildren();
      if (!post) return;
      const article = make('article','latest');
      const date = make('div','post-date');
      date.append(make('span','latest-label','最近写下'),make('time','date-year',post.date.slice(0,4)),make('time','date-month',dateShort(post.date)));
      const body = make('div','latest-body');
      const title = make('h2','lead-title');
      const link = articleLink(post);
      link.setAttribute('aria-label',post.title);
      if (post.slug === 'more-than-a-username') {
        const line = make('span','title-line'); line.setAttribute('aria-hidden','true');
        line.append(make('span','title-part','她'),make('span','title-part title-negation','不只是'));
        const second = make('span','title-line'); second.setAttribute('aria-hidden','true');
        second.append(make('span','title-part title-object','一个用户名'));
        link.append(line,second);
      } else {
        link.textContent = post.title;
        title.classList.add('long-title');
      }
      title.append(link);
      const context = make('div','lead-context');
      context.append(make('p','lead-description',post.description));
      context.append(make('p','post-meta',post.categories.join(' / ') + ' · ' + post.readingMinutes + ' 分钟 · ' + post.wordCount + ' 字'));
      const bottom = make('div','lead-bottom');
      const read = articleLink(post,'read');read.textContent='阅读全文';bottom.append(read);
      context.append(bottom);body.append(title,context);article.append(date,body);el('lead').append(article);
      titleMotion();
    }
    function renderEntries(query='') {
      const searching=Boolean(query.trim());
      const needle=query.trim().toLocaleLowerCase();
      const list=(searching?visible:visible.slice(1)).filter(p=>!searching||(p.title+' '+p.description+' '+p.categories.join(' ')).toLocaleLowerCase().includes(needle));
      el('lead').hidden=searching;
      el('directoryTitle').textContent=searching?'搜索结果':'接着读';
      el('entries').replaceChildren();
      let year='',section;
      for(const post of list) {
        const nextYear=post.date.slice(0,4);
        if(nextYear!==year) {
          year=nextYear;section=make('section','year-section');
          const label=make('h3','year-label',year);label.append(make('span','', '按写下的日期'));section.append(label);el('entries').append(section);
        }
        const article=make('article','entry'+(post.slug==='savepoint'?' photo-entry':''));
        const link=articleLink(post,'entry-link');
        const time=make('time','entry-time',dateShort(post.date));time.dateTime=post.date.slice(0,10);link.append(time);
        if(post.slug==='savepoint') {
          const copy=make('div','entry-copy');copy.append(make('h4','entry-title',post.title),make('p','entry-description',post.description));
          const figure=make('figure','post-photo');const img=make('img');img.src=DATA.photo;img.alt='公园小路通向湖边，远处是亮着灯的楼';img.loading='lazy';
          figure.append(img,make('figcaption','', '《过期的存档点》中的一张照片'));link.append(copy,figure);
        } else link.append(make('h4','entry-title',post.title),make('p','entry-description',post.description));
        article.append(link);section.append(article);
      }
      el('searchStatus').hidden=Boolean(list.length);
      el('searchStatus').textContent=searching?'没有找到这篇文章。':'还没有其他文章。';
    }
    if(visible.length) {
      el('collectionNote').replaceChildren(make('strong','','文章与音乐'),make('br'),document.createTextNode(visible[visible.length-1].date.slice(0,4)+'—'+visible[0].date.slice(0,4)+' · '+visible.length+' 篇'));
      renderLead(visible[0]);
    }
    renderEntries();
    el('postSearch').addEventListener('input',event=>renderEntries(event.target.value));

    let homeScroll=0;
    function openPost(post) {
      homeScroll=window.scrollY;
      closeLibrary();
      el('homeContent').hidden=true;el('reader').hidden=false;
      el('readerTitle').textContent=post.title;
      el('readerMeta').textContent=dateFull(post.date)+' · '+post.categories.join(' / ')+' · '+post.readingMinutes+' 分钟';
      el('readerBody').innerHTML=post.html;
      el('readerBody').querySelectorAll('img').forEach(img=>{
        const source=img.getAttribute('src');if(source&&source.startsWith('/'))img.src=mediaUrl(source);
      });
      history.pushState({post:post.slug},'', '#post='+encodeURIComponent(post.slug));
      window.scrollTo({top:el('content').offsetTop-document.querySelector('.soundbar').offsetHeight,behavior:'instant'});
      el('readerTitle').focus({preventScroll:true});
    }
    function closePost(restore=true) {
      el('reader').hidden=true;el('homeContent').hidden=false;
      if(restore)window.scrollTo({top:homeScroll,behavior:'instant'});
    }
    el('backHome').addEventListener('click',()=>{history.replaceState(null,'',location.pathname+location.search);closePost();});
    window.addEventListener('popstate',()=>{
      const slug=new URLSearchParams(location.hash.slice(1)).get('post');
      const post=visible.find(p=>p.slug===slug);
      if(post) { el('homeContent').hidden=true;el('reader').hidden=false;el('readerTitle').textContent=post.title;el('readerBody').innerHTML=post.html; }
      else closePost();
    });

    const theme=el('themeChoice'),osDark=matchMedia('(prefers-color-scheme: dark)');
    function applyTheme() {
      const root=document.documentElement;
      root.dataset.mode=theme.value==='dark'||(theme.value==='auto'&&osDark.matches)?'dark':'light';
      const h=new Date().getHours();root.dataset.time=h>=5&&h<8?'dawn':h>=17&&h<20?'dusk':h>=22||h<5?'deep-night':'day';
      document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.body).backgroundColor;
    }
    try { theme.value=localStorage.getItem('curve-theme')||'auto'; } catch(_) { theme.value='auto'; }
    if(!['auto','dark','light'].includes(theme.value))theme.value='auto';
    theme.addEventListener('change',()=>{try{localStorage.setItem('curve-theme',theme.value);}catch(_){}applyTheme();});
    osDark.addEventListener('change',applyTheme);setInterval(applyTheme,60000);applyTheme();

    // Standalone adapter only. The React surface subscribes to the existing singleton;
    // player, queue, seek and Media Session all use that controller's sole audio.
    function createPreviewController(audio,tracks) {
      let index=0;const listeners=new Set();
      const notify=()=>listeners.forEach(fn=>fn());
      const selectTrack=(next,resume=false)=>{
        index=(next+tracks.length)%tracks.length;audio.src=mediaUrl(tracks[index].url);audio.load();
        if('mediaSession' in navigator&&'MediaMetadata' in window) {
          navigator.mediaSession.metadata=new MediaMetadata({title:tracks[index].name,artist:tracks[index].artist,artwork:[{src:tracks[index].pic,type:'image/jpeg'}]});
        }
        notify();if(resume)audio.play().catch(()=>{el('playerStatus').textContent='播放没有开始，请再按一次播放。';});
      };
      const controller={
        get audio(){return audio;},get tracks(){return tracks;},get trackIndex(){return index;},
        get currentTrack(){return tracks[index];},get isPlaying(){return !audio.paused;},
        subscribe(fn){listeners.add(fn);return()=>listeners.delete(fn);},
        togglePlay(){if(audio.paused)audio.play().catch(()=>{el('playerStatus').textContent='这首歌暂时无法播放。';});else audio.pause();},
        next(){selectTrack(index+1,!audio.paused);},prev(){selectTrack(index-1,!audio.paused);},selectTrack,
      };
      ['play','pause','loadedmetadata','timeupdate','volumechange'].forEach(event=>audio.addEventListener(event,notify));
      audio.addEventListener('ended',()=>selectTrack(index+1,true));
      audio.addEventListener('error',()=>{el('playerStatus').textContent='这首歌暂时无法播放。';notify();});
      if('mediaSession' in navigator) {
        navigator.mediaSession.setActionHandler('play',()=>{if(audio.paused)controller.togglePlay();});
        navigator.mediaSession.setActionHandler('pause',()=>{if(!audio.paused)controller.togglePlay();});
        navigator.mediaSession.setActionHandler('previoustrack',()=>controller.prev());
        navigator.mediaSession.setActionHandler('nexttrack',()=>controller.next());
      }
      selectTrack(0);return controller;
    }
    const nowPlaying=createPreviewController(el('previewAudio'),DATA.tracks);
    const audio=nowPlaying.audio;
    const formatTime=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
    let lastTrack=-1;
    function syncPlayer() {
      const track=nowPlaying.currentTrack;
      if(nowPlaying.trackIndex!==lastTrack) {
        lastTrack=nowPlaying.trackIndex;el('songName').textContent=track.name;el('songName').title=track.name;
        el('songArtist').textContent=track.artist;el('coverImage').src=track.pic;
        el('queueList').querySelectorAll('button').forEach((button,index)=>button.setAttribute('aria-current',String(index===lastTrack)));
        el('playerStatus').textContent='';
      }
      const playing=nowPlaying.isPlaying;
      el('play').setAttribute('aria-label',playing?'暂停':'播放');el('play').title=playing?'暂停':'播放';
      el('playIcon').innerHTML=playing?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
      if('mediaSession' in navigator)navigator.mediaSession.playbackState=playing?'playing':'paused';
      const ratio=Number.isFinite(audio.duration)&&audio.duration>0?audio.currentTime/audio.duration:0;
      if(document.activeElement!==el('seek'))el('seek').value=String(Math.round(ratio*1000));
      el('seek').style.setProperty('--seek',ratio*100+'%');
      el('currentTime').textContent=formatTime(audio.currentTime);el('duration').textContent=formatTime(audio.duration);
      el('mute').setAttribute('aria-pressed',String(audio.muted));el('mute').setAttribute('aria-label',audio.muted?'取消静音':'静音');
    }
    DATA.tracks.forEach((track,index)=>{
      const row=make('li'),button=make('button');button.type='button';
      button.setAttribute('aria-label','播放 '+track.name+'，'+track.artist);
      button.append(make('span','queue-cue'),make('span','queue-name',track.name),make('span','queue-artist',track.artist));
      button.addEventListener('click',()=>{if(index===nowPlaying.trackIndex){if(!nowPlaying.isPlaying)nowPlaying.togglePlay();}else nowPlaying.selectTrack(index,true);});
      row.append(button);el('queueList').append(row);
    });
    nowPlaying.subscribe(syncPlayer);syncPlayer();
    el('play').addEventListener('click',()=>nowPlaying.togglePlay());
    el('previous').addEventListener('click',()=>nowPlaying.prev());el('next').addEventListener('click',()=>nowPlaying.next());
    el('mute').addEventListener('click',()=>{audio.muted=!audio.muted;});
    el('seek').addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=Number(el('seek').value)/1000*audio.duration;syncPlayer();});

    // Move the same seek element into the open library on small screens; never clone it.
    const smallScreen=matchMedia('(max-width:820px)');
    const progress=el('progressMount');const soundInner=document.querySelector('.sound-inner');
    function fitLibrary() {
      if(el('library').hidden)return;
      const available=Math.max(180,innerHeight-document.querySelector('.soundbar').getBoundingClientRect().bottom-16);
      el('library').style.setProperty('--library-room',available+'px');
    }
    function placeProgress(open) {
      if(smallScreen.matches&&open) {el('library').prepend(progress);progress.style.marginBottom='18px';}
      else {soundInner.insertBefore(progress,el('libraryToggle'));progress.style.marginBottom='';}
    }
    function closeLibrary() {el('library').hidden=true;el('libraryToggle').setAttribute('aria-expanded','false');placeProgress(false);}
    el('libraryToggle').addEventListener('click',()=>{
      const open=el('library').hidden;el('library').hidden=!open;el('libraryToggle').setAttribute('aria-expanded',String(open));placeProgress(open);fitLibrary();
    });
    smallScreen.addEventListener('change',()=>{placeProgress(!el('library').hidden);fitLibrary();});
    window.addEventListener('resize',fitLibrary);
    window.addEventListener('scroll',fitLibrary,{passive:true});
    document.addEventListener('pointerdown',event=>{if(!document.querySelector('.soundbar').contains(event.target))closeLibrary();});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!el('library').hidden){closeLibrary();el('libraryToggle').focus();}});
  </script>
</body>
</html>
