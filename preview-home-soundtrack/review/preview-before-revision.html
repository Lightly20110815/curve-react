<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f3f0">
  <title>曲線時報 · 带声轨的文集目录</title>
  <meta name="description" content="曲線時報：Sy 的文章、随笔与音乐。">
  <script>
    (function () {
      var preference = 'auto';
      try { preference = localStorage.getItem('curve-theme') || 'auto'; } catch (_) {}
      if (!['auto', 'light', 'dark'].includes(preference)) preference = 'auto';
      var dark = preference === 'dark' || (preference === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.mode = dark ? 'dark' : 'light';
      document.documentElement.dataset.time = getTime();
      function getTime() {
        var h = new Date().getHours();
        return h >= 5 && h < 8 ? 'dawn' : h >= 17 && h < 20 ? 'dusk' : h >= 22 || h < 5 ? 'deep-night' : 'day';
      }
    })();
  </script>
  <style>
    :root {
      --page: #f2f3f0;
      --raised: #e9eae6;
      --ink: #15191b;
      --sub: #4f5759;
      --quiet: #6b7375;
      --line: #bdc2bf;
      --line-strong: #303739;
      --red: #b53430;
      --red-soft: #eee0dc;
      --paper-edge: #dfe2dd;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
    }
    :root[data-mode="light"][data-time="dawn"] { --page:#f2f2ef; --raised:#e9eae4; --ink:#171a1b; --line:#c2c6c0; }
    :root[data-mode="light"][data-time="dusk"] { --page:#f1f1ed; --raised:#e7e7e1; --ink:#191a1b; --line:#c2c2bb; }
    :root[data-mode="light"][data-time="deep-night"] { --page:#eceff0; --raised:#e3e7e8; --ink:#171d22; --line:#b9c1c3; }
    :root[data-mode="dark"] {
      --page:#111519;
      --raised:#1b2125;
      --ink:#edf0eb;
      --sub:#c0c7c5;
      --quiet:#a0aaa9;
      --line:#3d4649;
      --line-strong:#d1d8d3;
      --red:#ee756b;
      --red-soft:#352321;
      --paper-edge:#242b2d;
    }
    :root[data-mode="dark"][data-time="dawn"] { --page:#151819; --raised:#202425; }
    :root[data-mode="dark"][data-time="dusk"] { --page:#17191a; --raised:#222526; }
    :root[data-mode="dark"][data-time="deep-night"] { --page:#0d131a; --raised:#171e25; --line:#36434b; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; background:var(--page); color:var(--ink); font-family:var(--sans);
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    }
    body, button, select, input { font-family:var(--sans); }
    button, select { color:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
      outline:2px solid var(--red); outline-offset:4px;
    }
    ::selection { background:var(--red); color:var(--page); }
    .skip {
      position:absolute; z-index:100; top:-100px; left:16px; padding:8px 12px;
      background:var(--ink); color:var(--page);
    }
    .skip:focus { top:12px; }
    .shell { width:min(100% - 72px, 1272px); margin-inline:auto; }
    .sitebar { position:sticky; top:0; z-index:40; background:var(--page); border-bottom:1px solid var(--line-strong); }
    .sitebar-inner { min-height:54px; display:flex; align-items:center; justify-content:space-between; gap:24px; }
    .small-brand { font-weight:900; font-size:17px; letter-spacing:-.07em; white-space:nowrap; }
    .small-brand span { margin-left:11px; font-family:var(--mono); font-size:9px; font-weight:500; letter-spacing:.09em; color:var(--quiet); vertical-align:middle; }
    .sitebar-right { display:flex; align-items:center; gap:29px; }
    .topnav { display:flex; gap:20px; white-space:nowrap; }
    .topnav a { font-size:12px; font-weight:700; padding:18px 0; border-bottom:2px solid transparent; }
    .topnav a[aria-current="page"] { border-color:var(--red); }
    .topnav a:hover { border-color:var(--ink); }
    .theme-picker { display:flex; align-items:center; gap:7px; color:var(--quiet); white-space:nowrap; font-size:11px; }
    .theme-picker select { padding:5px 7px; border:1px solid var(--line); border-radius:0; background:var(--page); font-size:11px; }
    .opening { padding:42px 0 33px; border-bottom:2px solid var(--ink); }
    .opening-top { display:flex; align-items:center; justify-content:space-between; gap:20px; font-family:var(--mono); font-size:11px; color:var(--sub); }
    .opening-top .rulemark { width:32px; height:4px; background:var(--red); display:inline-block; vertical-align:middle; margin-right:10px; }
    .opening-main { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,330px); align-items:end; gap:28px; padding-top:29px; }
    .wordmark { margin:0 0 -8px -.07em; display:flex; align-items:flex-end; white-space:nowrap; overflow:hidden; font-size:clamp(51px, 7.75vw, 108px); font-weight:950; line-height:1.18; letter-spacing:-.105em; }
    .wordmark .glyph { display:inline-block; transform-origin:center bottom; animation:drop-into-place 720ms both; animation-delay:calc(var(--n) * 115ms); }
    .wordmark .glyph:last-child { color:var(--red); }
    @keyframes drop-into-place {
      0% { transform:translateY(-130%); opacity:1; animation-timing-function:cubic-bezier(.52,.02,.88,.42); }
      69% { transform:translateY(5%); animation-timing-function:cubic-bezier(.12,.65,.24,1); }
      100% { transform:translateY(0); opacity:1; }
    }
    .opening-note { border-left:1px solid var(--line); padding-left:20px; padding-bottom:5px; }
    .opening-note strong { display:block; font-family:var(--mono); font-size:11px; font-weight:600; color:var(--red); letter-spacing:.07em; }
    .opening-note p { margin:12px 0 0; font-size:14px; line-height:1.8; color:var(--sub); }
    .opening-note .latest-date { white-space:nowrap; }
    .layout { display:grid; grid-template-columns:264px minmax(0,1fr); column-gap:0; }
    .rail { min-width:0; padding:48px 36px 68px 0; border-right:1px solid var(--line); }
    .rail-sticky { position:sticky; top:28px; }
    .rail-label, .column-label {
      margin:0; font-family:var(--mono); font-size:11px; font-weight:600; line-height:1.4;
      letter-spacing:.09em; color:var(--red);
    }
    .player { margin-top:15px; }
    .art {
      display:grid; place-items:center; width:100%; aspect-ratio:1;
      overflow:hidden; background:var(--raised); border:1px solid var(--line); position:relative;
    }
    .art img { width:100%; height:100%; display:block; object-fit:cover; }
    .art-fallback { width:100%; height:100%; padding:18px; display:flex; flex-direction:column; justify-content:space-between; }
    .art-fallback span:first-child { font-size:12px; font-weight:900; letter-spacing:-.05em; }
    .art-fallback span:last-child { align-self:flex-end; font-family:var(--mono); font-size:10px; color:var(--sub); }
    .song-meta { padding-top:16px; min-height:81px; overflow:hidden; }
    .song-name { display:block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px; font-weight:800; line-height:1.35; }
    .song-name.arrive { animation:song-arrive 480ms cubic-bezier(.22,1,.36,1) both; }
    @keyframes song-arrive { from { transform:translateY(-95%); opacity:0; } to { transform:translateY(0); opacity:1; } }
    .song-artist { display:block; margin-top:4px; font-size:12px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .seek { width:100%; height:28px; margin:0; padding:0; appearance:none; background:transparent; cursor:pointer; }
    .seek::-webkit-slider-runnable-track { height:3px; background:linear-gradient(to right, var(--red) var(--seek, 0%), var(--line) var(--seek, 0%)); }
    .seek::-moz-range-track { height:3px; background:var(--line); }
    .seek::-moz-range-progress { height:3px; background:var(--red); }
    .seek::-webkit-slider-thumb { appearance:none; width:12px; height:12px; margin-top:-4.5px; border:2px solid var(--page); background:var(--red); border-radius:50%; box-shadow:0 0 0 1px var(--red); }
    .seek::-moz-range-thumb { width:9px; height:9px; border:2px solid var(--page); background:var(--red); border-radius:50%; box-shadow:0 0 0 1px var(--red); }
    .times { display:flex; justify-content:space-between; margin-top:-2px; font-family:var(--mono); font-size:10px; color:var(--quiet); }
    .controls { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; }
    .controls button { display:grid; place-items:center; flex:none; width:38px; height:38px; padding:0; border:1px solid var(--line); background:var(--page); }
    .controls button:hover { border-color:var(--ink); background:var(--raised); }
    .controls .play { width:47px; height:47px; background:var(--ink); color:var(--page); border-color:var(--ink); }
    .controls .play:hover { background:var(--red); border-color:var(--red); }
    .controls svg { display:block; width:17px; height:17px; fill:currentColor; }
    .controls .play svg { width:19px; height:19px; }
    .track-info { min-height:38px; margin:11px 0 0; font-size:11px; line-height:1.55; color:var(--quiet); }
    .rail-nav { border-top:1px solid var(--line-strong); margin-top:28px; }
    .rail-nav a { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; font-size:12px; font-weight:700; border-bottom:1px solid var(--line); }
    .rail-nav a::after { content:""; width:10px; height:2px; flex:none; background:var(--line); transition:width .2s, background .2s; }
    .rail-nav a:hover::after { width:25px; background:var(--red); }
    .contents { min-width:0; padding:48px 0 88px clamp(36px, 6vw, 94px); }
    .column-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; padding-bottom:16px; border-bottom:1px solid var(--line-strong); }
    .column-head .count { font-family:var(--mono); font-size:11px; color:var(--quiet); white-space:nowrap; }
    .lead { padding:25px 0 39px; border-bottom:2px solid var(--ink); }
    .lead-meta { font-family:var(--mono); color:var(--red); font-size:11px; font-weight:600; letter-spacing:.05em; }
    .lead-title { max-width:18ch; margin:15px 0 16px; font-weight:850; font-size:clamp(31px, 4.2vw, 56px); line-height:1.26; letter-spacing:-.055em; overflow-wrap:anywhere; }
    .lead-description { max-width:37em; margin:0; font-size:17px; line-height:1.85; color:var(--sub); }
    .lead-bottom { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-top:29px; }
    .read-article { border-bottom:2px solid var(--red); padding-bottom:5px; font-size:13px; font-weight:700; }
    .read-article:hover { background:var(--red-soft); }
    .lead-reading { font-family:var(--mono); font-size:11px; color:var(--quiet); }
    .index-head { display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-top:48px; }
    .index-head h2 { margin:0; font-size:21px; font-weight:850; letter-spacing:-.045em; }
    .index-head span { font-size:11px; color:var(--quiet); }
    .year { margin-top:28px; }
    .year-name { margin:0; padding-bottom:9px; font-family:var(--mono); font-size:17px; font-weight:600; letter-spacing:.02em; border-bottom:1px solid var(--line-strong); }
    .entry { margin:0; border-bottom:1px solid var(--line); }
    .entry-link { display:grid; grid-template-columns:88px minmax(0,1fr) 18px; gap:22px; align-items:start; padding:19px 11px 20px 0; transition:background .18s, padding-left .18s; }
    .entry-link:hover { padding-left:11px; background:var(--raised); }
    .entry-date { font-family:var(--mono); font-size:11px; color:var(--quiet); padding-top:6px; }
    .entry-title { display:block; font-size:21px; line-height:1.42; font-weight:750; letter-spacing:-.035em; overflow-wrap:anywhere; }
    .entry-desc { display:block; margin-top:6px; max-width:42em; font-size:13px; line-height:1.68; color:var(--sub); }
    .entry-mark { display:block; width:14px; height:2px; background:var(--line); margin-top:12px; transition:width .18s, background .18s; }
    .entry-link:hover .entry-mark { width:20px; background:var(--red); }
    .endnav { display:flex; flex-wrap:wrap; gap:26px; padding-top:36px; }
    .endnav a { font-size:13px; font-weight:700; border-bottom:1px solid var(--ink); padding-bottom:4px; }
    .endnav a:hover { border-bottom-color:var(--red); background:var(--red-soft); }
    .sitefoot { border-top:1px solid var(--line-strong); }
    .sitefoot-inner { display:flex; align-items:center; justify-content:space-between; gap:18px; min-height:72px; font-family:var(--mono); font-size:11px; color:var(--quiet); }
    .sitefoot-inner a { text-decoration:underline; text-underline-offset:3px; }
    .sitefoot-inner a:hover { color:var(--red); }
    .empty { margin:24px 0; line-height:1.7; color:var(--sub); }
    @media (max-width:900px) {
      .shell { width:min(100% - 44px, 1272px); }
      .topnav { gap:12px; }
      .topnav a { font-size:11px; }
      .opening-main { grid-template-columns:1fr; }
      .opening-note { width:min(100%, 560px); }
      .wordmark { font-size:clamp(50px, 11vw, 92px); }
      .layout { grid-template-columns:220px minmax(0,1fr); }
      .rail { padding-right:22px; }
      .contents { padding-left:36px; }
      .entry-link { grid-template-columns:72px minmax(0,1fr) 14px; gap:12px; }
    }
    @media (max-width:680px) {
      .shell { width:calc(100% - 34px); }
      .sitebar-inner { min-height:50px; }
      .small-brand span { display:none; }
      .sitebar-right { gap:11px; }
      .topnav { gap:9px; }
      .topnav a { font-size:11px; }
      .topnav a:nth-child(n+3) { display:none; }
      .theme-picker { font-size:0; }
      .theme-picker select { font-size:11px; }
      .opening { padding:28px 0 25px; }
      .opening-top { font-size:10px; }
      .opening-main { padding-top:21px; gap:19px; }
      .wordmark { font-size:clamp(43px, 12vw, 72px); margin-bottom:-4px; }
      .opening-note { padding-left:13px; }
      .opening-note p { margin-top:5px; font-size:12px; line-height:1.6; }
      .layout { display:flex; flex-direction:column; }
      .rail { border-right:0; border-bottom:1px solid var(--line-strong); padding:24px 0; }
      .rail-sticky { position:static; }
      .player { display:grid; grid-template-columns:72px minmax(0,1fr); align-items:start; gap:0 15px; margin-top:10px; }
      .art { grid-row:1/4; }
      .art-fallback { padding:7px; }
      .art-fallback span:first-child { font-size:8px; }
      .art-fallback span:last-child { font-size:7px; }
      .song-meta { padding-top:0; min-height:48px; }
      .song-name { font-size:15px; }
      .song-artist { font-size:11px; }
      .seek { grid-column:2; height:22px; }
      .times { grid-column:2; margin-top:-5px; }
      .controls { grid-column:1/-1; margin-top:10px; justify-content:flex-start; gap:11px; }
      .controls button { width:32px; height:32px; }
      .controls .play { width:38px; height:38px; }
      .track-info { grid-column:1/-1; min-height:0; margin:5px 0 0; }
      .rail-nav { display:none; }
      .contents { padding:30px 0 65px; }
      .lead { padding-bottom:31px; }
      .lead-title { font-size:clamp(31px, 8.7vw, 48px); }
      .lead-description { font-size:15px; }
      .index-head { margin-top:35px; }
      .entry-link { display:block; padding:16px 0 18px; }
      .entry-link:hover { padding-left:8px; }
      .entry-date { display:block; padding:0 0 7px; }
      .entry-title { font-size:19px; }
      .entry-desc { font-size:12px; }
      .entry-mark { display:none; }
      .sitefoot-inner { padding:19px 0; flex-direction:column; align-items:flex-start; min-height:0; }
    }
    @media (max-width:390px) {
      .topnav a:nth-child(2) { display:none; }
      .opening-top span:last-child { max-width:125px; text-align:right; }
      .wordmark { font-size:clamp(39px, 11.9vw, 50px); }
    }
    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      .wordmark .glyph, .song-name.arrive { animation:none !important; transform:none !important; opacity:1 !important; }
      *, *::before, *::after { transition-duration:0.01ms !important; }
    }

    /* The reading spread: one strong article field beside an actual music library. */

    const audio = document.getElementById('audio');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const themeChoice = document.getElementById('themeChoice');
    const osDark = matchMedia('(prefers-color-scheme: dark)');
    const search = new URLSearchParams(location.search);
    const asOf = search.get('as-of');
    const visiblePosts = POSTS.filter(p => !asOf || p.date.slice(0, 10) <= asOf);
    const create = (tag, className, value) => {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (value !== undefined) el.textContent = value;
      return el;
    };
    const dateString = iso => iso.slice(0, 10).replaceAll('-', '.');
    const dateShort = iso => iso.slice(5, 10).replace('-', '.');
    const postUrl = post => '/posts/' + encodeURIComponent(post.slug);
    const mediaUrl = path => location.protocol === 'file:' ? '../public' + path : path;

    function renderPosts() {
      const lead = document.getElementById('lead');
      const entries = document.getElementById('entries');
      lead.replaceChildren();
      entries.replaceChildren();
      document.getElementById('articleCount').textContent = visiblePosts.length + ' 篇';
      if (!visiblePosts.length) {
        document.getElementById('openingSummary').textContent = '这个日期之前还没有文章。音乐还在。';
        lead.append(create('p', 'empty', '这个日期之前还没有文章。'));
        document.querySelector('.index-head').hidden = true;
        return;
      }
      const first = visiblePosts[0];
      const oldest = visiblePosts[visiblePosts.length - 1];
      document.getElementById('openingSummary').textContent = visiblePosts.length + ' 篇文章，写于 ' + oldest.date.slice(0, 4) + ' 至 ' + first.date.slice(0, 4) + '。放一首歌，再往下翻。';
      document.getElementById('openingDate').textContent = '最近写于 ' + dateString(first.date);
      const hero = create('article', 'lead');
      hero.append(create('div', 'lead-meta', dateString(first.date) + '　·　' + (first.categories[0] || '文章')));
      const h2 = create('h2', 'lead-title');
      const headline = create('a', '', first.title);
      headline.href = postUrl(first);
      h2.append(headline);
      hero.append(h2);
      if (first.description) hero.append(create('p', 'lead-description', first.description));
      const bottom = create('div', 'lead-bottom');
      const read = create('a', 'read-article', '读这篇');
      read.href = postUrl(first);
      bottom.append(read, create('span', 'lead-reading', '约 ' + first.readingMinutes + ' 分钟 · ' + first.wordCount + ' 字'));
      hero.append(bottom);
      lead.append(hero);
      const rest = visiblePosts.slice(1);
      if (!rest.length) {
        document.querySelector('.index-head').hidden = true;
        return;
      }
      document.querySelector('.index-head').hidden = false;
      let year = '';
      let group;
      for (const post of rest) {
        const thisYear = post.date.slice(0, 4);
        if (thisYear !== year) {
          year = thisYear;
          group = create('section', 'year');
          group.append(create('h3', 'year-name', year));
          entries.append(group);
        }
        if (post.slug === 'savepoint') {
          const article = create('article', 'photo-entry');
          const link = create('a');
          link.href = postUrl(post);
          const photo = create('img');
          photo.src = mediaUrl('/images/posts/savepoint/04-lake.jpg');
          photo.alt = '《过期的存档点》中的夜景：公园小路、湖面和远处亮灯的楼';
          photo.loading = 'lazy';
          const caption = create('span', 'photo-entry-copy');
          caption.append(create('span', 'photo-entry-date', dateString(post.date) + ' · ' + post.categories[0]));
          const text = create('span');
          text.append(create('span', 'photo-entry-title', post.title));
          text.append(create('span', 'photo-entry-desc', post.description));
          caption.append(text);
          link.append(photo, caption);
          article.append(link);
          group.append(article);
          continue;
        }
        const article = create('article', 'entry');
        const link = create('a', 'entry-link');
        link.href = postUrl(post);
        link.setAttribute('aria-label', post.title + '，' + dateString(post.date));
        link.append(create('time', 'entry-date', dateShort(post.date)));
        const words = create('span', 'entry-words');
        words.append(create('span', 'entry-title', post.title));
        if (post.description) words.append(create('span', 'entry-desc', post.description));
        link.append(words, create('span', 'entry-mark'));
        article.append(link);
        group.append(article);
      }
    }
    renderPosts();

    function timePhase() {
      const h = new Date().getHours();
      return h >= 5 && h < 8 ? 'dawn' : h >= 17 && h < 20 ? 'dusk' : h >= 22 || h < 5 ? 'deep-night' : 'day';
    }
    function applyTheme() {
      const pref = themeChoice.value;
      document.documentElement.dataset.mode = pref === 'dark' || (pref === 'auto' && osDark.matches) ? 'dark' : 'light';
      document.documentElement.dataset.time = timePhase();
      document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.body).backgroundColor;
    }
    try { themeChoice.value = localStorage.getItem('curve-theme') || 'auto'; } catch (_) { themeChoice.value = 'auto'; }
    if (!['auto', 'light', 'dark'].includes(themeChoice.value)) themeChoice.value = 'auto';
    themeChoice.addEventListener('change', () => {
      try { localStorage.setItem('curve-theme', themeChoice.value); } catch (_) {}
      applyTheme();
    });
    osDark.addEventListener('change', applyTheme);
    setInterval(applyTheme, 60_000);
    applyTheme();

    let tracks = FALLBACK_TRACKS;
    let trackIndex = 0;
    const songName = document.getElementById('songName');
    const songArtist = document.getElementById('songArtist');
    const cover = document.getElementById('cover');
    const seek = document.getElementById('seek');
    const play = document.getElementById('play');
    const playIcon = document.getElementById('playIcon');
    const trackInfo = document.getElementById('trackInfo');
    const queueList = document.getElementById('queueList');
    const formatTime = n => {
      if (!Number.isFinite(n)) return '0:00';
      return Math.floor(n / 60) + ':' + String(Math.floor(n % 60)).padStart(2, '0');
    };
    function renderQueue() {
      queueList.replaceChildren();
      document.getElementById('queueCount').textContent = tracks.length + ' 首';
      tracks.forEach((track, index) => {
        const row = create('li');
        const button = create('button');
        button.type = 'button';
        button.setAttribute('aria-current', index === trackIndex ? 'true' : 'false');
        button.setAttribute('aria-label', '播放 ' + track.name + '，' + track.artist);
        button.append(create('span', 'queue-cue', index === trackIndex ? '●' : '—'));
        const copy = create('span');
        copy.append(create('span', 'queue-name', track.name), create('span', 'queue-artist', track.artist));
        button.append(copy);
        button.addEventListener('click', () => {
          if (index === trackIndex) audio.play().catch(() => {});
          else setTrack(index, true);
        });
        row.append(button);
        queueList.append(row);
      });
    }
    function setTrack(index, resume) {
      if (!tracks.length) return;
      trackIndex = (index + tracks.length) % tracks.length;
      const track = tracks[trackIndex];
      audio.src = mediaUrl(track.url);
      audio.load();
      songName.textContent = track.name;
      songName.title = track.name;
      songArtist.textContent = track.artist || '歌手未标注';
      cover.replaceChildren();
      if (track.pic) {
        const img = create('img');
        img.src = track.pic.startsWith('/Musics/') || track.pic.startsWith('/audio/') ? mediaUrl(track.pic) : track.pic;
        img.alt = '';
        img.onerror = () => { cover.replaceChildren(makeCoverFallback()); };
        cover.append(img);
      } else {
        cover.append(makeCoverFallback());
      }
      if (!reducedMotion.matches) {
        songName.classList.remove('arrive');
        void songName.offsetWidth;
        songName.classList.add('arrive');
      }
      trackInfo.textContent = '站内曲库 · ' + tracks.length + ' 首 · 第 ' + (trackIndex + 1) + ' 首';
      renderQueue();
      seek.value = '0';
      updateProgress();
      if (resume) audio.play().catch(() => { trackInfo.textContent = '浏览器没有开始播放，请再按一次播放'; });
    }
    function makeCoverFallback() {
      const fallback = create('div', 'art-fallback');
      fallback.append(create('span', '', '曲線時報'), create('span', '', 'CURVE RADIO'));
      return fallback;
    }
    function updatePlay() {
      const isPlaying = !audio.paused;
      play.setAttribute('aria-label', isPlaying ? '暂停' : '播放');
      play.title = isPlaying ? '暂停' : '播放';
      playIcon.innerHTML = isPlaying ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }
    function updateProgress() {
      const duration = Number.isFinite(audio.duration) ? audio.duration : 0;
      const current = Number.isFinite(audio.currentTime) ? audio.currentTime : 0;
      const ratio = duration > 0 ? current / duration : 0;
      seek.value = String(Math.round(ratio * 1000));
      seek.style.setProperty('--seek', (ratio * 100) + '%');
      document.getElementById('currentTime').textContent = formatTime(current);
      document.getElementById('duration').textContent = formatTime(duration);
    }
    play.addEventListener('click', () => {
      if (!tracks.length) return;
      if (audio.paused) audio.play().catch(() => { trackInfo.textContent = '无法播放这首歌'; });
      else audio.pause();
    });
    document.getElementById('previous').addEventListener('click', () => setTrack(trackIndex - 1, !audio.paused));
    document.getElementById('next').addEventListener('click', () => setTrack(trackIndex + 1, !audio.paused));
    document.getElementById('mute').addEventListener('click', event => {
      audio.muted = !audio.muted;
      event.currentTarget.setAttribute('aria-label', audio.muted ? '取消静音' : '静音');
      event.currentTarget.title = audio.muted ? '取消静音' : '静音';
      event.currentTarget.style.background = audio.muted ? 'var(--red-soft)' : '';
    });
    seek.addEventListener('input', () => {
      if (Number.isFinite(audio.duration)) audio.currentTime = Number(seek.value) / 1000 * audio.duration;
      updateProgress();
    });
    audio.addEventListener('play', updatePlay);
    audio.addEventListener('pause', updatePlay);
    audio.addEventListener('loadedmetadata', updateProgress);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', () => setTrack(trackIndex + 1, true));
    audio.addEventListener('error', () => { trackInfo.textContent = '这首歌暂时无法播放'; });
    fetch('/Musics/manifest.json').then(response => {
      if (!response.ok) throw Error('manifest unavailable');
      return response.json();
    }).then(manifest => {
      if (!Array.isArray(manifest) || !manifest.length) return;
      const wasPlaying = !audio.paused;
      const currentUrl = tracks[trackIndex]?.url;
      tracks = manifest;
      const match = tracks.findIndex(t => t.url === currentUrl);
      if (match >= 0) {
        trackIndex = match;
        if (tracks[match].pic && !cover.querySelector('img')) {
          const img = create('img');
          img.src = tracks[match].pic;
          img.alt = '';
          cover.replaceChildren(img);
        }
        trackInfo.textContent = '站内曲库 · ' + tracks.length + ' 首 · 第 ' + (trackIndex + 1) + ' 首';
        renderQueue();
      } else setTrack(0, wasPlaying);
    }).catch(() => {});
    setTrack(0, false);
  </script>
</body>
</html>
