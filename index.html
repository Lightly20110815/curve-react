<!doctype html>
<html lang="zh-CN" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1e" />
    <title>Sy 的数字花园</title>
    <meta name="description" content="一座深夜的数字花园。写给某个深夜路过的你。" />

    <!--
      Fonts:
      - LXGW WenKai Screen (霞鹜文楷屏幕阅读版) → 全站主字体，手写楷体的日记感
      - 系统等宽栈 → 日期、元信息、代码
      字体按 unicode-range 分包加载，font-display: swap；
      CDN 失效时优雅回退到本机楷体（Kaiti SC / KaiTi）。
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css"
    />

    <!-- Theme initializer — 主题跟随时辰，React 挂载前执行以避免闪烁 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("garden-theme");
          var hour = new Date().getHours();
          var timeTheme = hour >= 18 || hour < 6 ? "night" : "dawn";
          var theme =
            stored === "night" || stored === "dawn" ? stored : timeTheme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === "night" ? "dark" : "light";
          var chrome = theme === "night" ? "#0a0f1e" : "#f1f3f6";
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", chrome);
        } catch (_) {
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>

    <style>
      html { background-color: #0a0f1e; }
      html[data-theme="dawn"] { background-color: #f1f3f6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
